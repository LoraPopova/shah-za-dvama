<style>

<body>
<canvas id="scene"></canvas>
<header id="hud"><div><div id="label">T W O  H A L V E S · LEVEL 01 · v2</div><h1>Един ден. Една нощ.</h1><div id="stage">Двата палеца започват деня.</div></div>
<div id="stats"><span id="energy0">Синя ♡100</span><span id="energy1">Корал ♡100</span><span id="income">✦0</span></div></header>
<div id="bartrack"><div id="barfill"></div></div>
<div id="menu"><button id="reset">Отначало</button><button id="pause">Пауза</button></div>
<div id="message">По-дълъг ден и нощ. Пет прохода, три силни ветрове и обща камера.</div>
<div class="pad left" id="pad0"><div class="disc"></div><span>ЛЯВ ПАЛЕЦ</span></div>
<div class="pad right" id="pad1"><div class="disc"></div><span>ДЕСЕН ПАЛЕЦ</span></div>
<div id="result"><div class="card"><h2 id="outcome"></h2><p id="summary"></p><button id="again">Играй отново</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,x,y)=>Math.hypot(a-x,b-y);
const TWO=Math.PI*2,GAIN=2.5,PACE=5,DAY_END=735,DUSK_END=825,END=1350;
// Exact five independent non-mirrored holes from Day 18 v2.
const DAY_ROWS=Object.freeze([
 {id:'first',at:125,gaps:[.68,.38],width:.20},
 {id:'second',at:160,gaps:[.28,.67],width:.20},
 {id:'third',at:195,gaps:[.57,.25],width:.19},
 {id:'fourth',at:230,gaps:[.37,.53],width:.20},
 {id:'fifth',at:265,gaps:[.72,.74],width:.19}
]);
const NIGHT_ROWS=Object.freeze([
 {id:'moon1',at:920,center:.31,width:.43},
 {id:'moon2',at:978,center:.70,width:.44},
 {id:'moon3',at:1036,center:.48,width:.48},
 {id:'moon4',at:1094,center:.29,width:.43},
 {id:'moon5',at:1152,center:.68,width:.43},
 {id:'moon6',at:1210,center:.40,width:.48},
 {id:'moon7',at:1268,center:.59,width:.49}
]);
// Day 13 Wind v2: exact 1.00, 1.24, 1.37 and centre/outside spikes.
const WIND_BANDS=Object.freeze([
 {id:'inward',start:325,end:381,sign:[1,-1],strength:1,hazard:'center',label:'КЪМ СРЕДАТА'},
 {id:'outward',start:414,end:470,sign:[-1,1],strength:1.24,hazard:'outer',label:'НАВЪН'},
 {id:'cross',start:502,end:560,sign:[1,-1],strength:1.37,hazard:'center',label:'СИЛЕН ПОРИВ'}
]);
const COINS=Object.freeze([
 [22,.26,0,1],[22,.74,1,1],[53,.33,0,1],[53,.67,1,1],
 [86,.29,0,1],[86,.78,1,1],[117,.34,0,1],[117,.70,1,1],
 [181,.32,0,1],[181,.78,1,1],[218,.39,0,1],[218,.63,1,1],
 [286,.28,0,3],[286,.73,1,3],[305,.37,0,1],[305,.64,1,1],
 [392,.22,0,1],[392,.80,1,1],[478,.30,0,3],[478,.70,1,3],
 [578,.28,0,1],[578,.75,1,1],[608,.37,0,1],[608,.64,1,1],
 [690,.29,0,1],[690,.73,1,1],[712,.40,0,1],[712,.60,1,1]
].map((q,i)=>Object.freeze({id:'c'+i,at:q[0],x:q[1],side:q[2],value:q[3]})));
const FIREFLIES=Object.freeze([
 {id:'f0',at:878,x:.50},{id:'f1',at:945,x:.33},{id:'f2',at:1008,x:.68},
 {id:'f3',at:1066,x:.49},{id:'f4',at:1120,x:.29},{id:'f5',at:1175,x:.69},
 {id:'f6',at:1238,x:.42},{id:'f7',at:1301,x:.61}
]);
const pads=[{id:null,x:0,y:0,el:$('pad0')},{id:null,x:0,y:0,el:$('pad1')}];
let W=1,H=1,dpr=1,g=null,prevFrame=0;
const rad=()=>clamp(Math.min(W,H)*.019,11,19);
const top=()=>clamp(H*.13,110,192);
const bottom=()=>H-Math.max(22,H*.035);
const height=()=>bottom()-top();
const heroY=()=>top()+height()*.29;
const speed=()=>clamp(height()*.012,6.6,10);
const worldY=(at,t=g.t)=>heroY()+(at-t)*speed();
const bounds=(n,twilight=false)=>{
 const r=rad();return twilight?(n===0?[r,W*.5+r*.78]:[W*.5-r*.78,W-r]):n===0?[r,W*.5-r]:[W*.5+r,W-r];
};
const clampY=y=>clamp(y,top()+rad(),bottom()-rad());
const stage=t=>t<DAY_END?'day':t<DUSK_END?'dusk':'night';
const wall=()=>clamp(Math.min(W,H)*.009,5,10);
const rowGap=(row,n)=>{
 const half=W*.5,r=rad(),loc=(n+row.gaps[n])*half;
 const span=clamp(half*row.width*.5,r*2.65,half*.30);
 return {center:loc,lo:loc-span,hi:loc+span};
};
const nightGap=row=>{
 const half=clamp(W*row.width*.5,rad()*4,W*.38);
 return {lo:clamp(W*row.center-half,rad()*1.3,W-rad()*3),
 hi:clamp(W*row.center+half,rad()*3,W-rad()*1.3),center:row.center*W};
};
// SK-01 v4 silhouette: attached turquoise key left, brown chamber right.
const keyGeom=(time=g.t)=>{
 const y=worldY(650,time),r=rad(),seam=W*.5;
 const panelWidth=clamp(W*.095,r*2.6,86);
 const roomHalf=clamp(height()*.086,r*3.2,88);
 const doorHalf=clamp(roomHalf*.54,r*1.95,roomHalf-r*.65);
 const keyLeft=seam-panelWidth,roomRight=W*.81;
 return {y,keyLeft,keyRight:seam,keyX:(keyLeft+seam)*.5,
  keyR:Math.min(panelWidth*.43,roomHalf*.6),gateX:roomRight,
  roomLeft:seam,roomRight,roomHalf,doorHalf,gapHalf:doorHalf,
  starX:seam+(roomRight-seam)*.47,panelWidth};
};
const windForce=()=>clamp(W*.115,53,126);
const windAt=(y,t=g.t)=>{
 for(const band of WIND_BANDS)
  if(y>=worldY(band.start,t)&&y<=worldY(band.end,t))return band;
 return null;
};
const windSpike=(x,y,t=g.t)=>{
 const band=windAt(y,t);if(!band)return false;
 if(band.hazard==='outer'){
  const reach=clamp(W*.036,18,34)+rad()*.55;
  return x<=reach+6||x>=W-reach-6;
 }
 const reach=clamp(W*.036,17,32)+rad()*.66;
 return Math.abs(x-W*.5)<reach;
};
const segSq=(x,y,ax,ay,bx,by)=>{
 const dx=bx-ax,dy=by-ay,dd=dx*dx+dy*dy,k=dd?clamp(((x-ax)*dx+(y-ay)*dy)/dd,0,1):0;
 return (x-ax-k*dx)**2+(y-ay-k*dy)**2;
};
function barriers(t=g.t,kind=stage(t)){
 const segments=[],th=wall();
 if(kind==='day'){
  for(const row of DAY_ROWS){
   const y=worldY(row.at,t);
   if(y<top()-rad()*3||y>bottom()+rad()*3)continue;
   for(let n=0;n<2;n++){
    const x0=n*W*.5+3,x1=(n+1)*W*.5-3,z=rowGap(row,n);
    segments.push([x0,y,z.lo,y,th,row.id,n],[z.hi,y,x1,y,th,row.id,n]);
   }
  }
  const k=keyGeom(t),y=k.y;
  if(y>=top()-k.roomHalf-rad()*2&&y<=bottom()+k.roomHalf+rad()*2){
   segments.push([k.roomLeft,y-k.roomHalf,k.roomRight,y-k.roomHalf,th,'chamber',1],
    [k.roomLeft,y+k.roomHalf,k.roomRight,y+k.roomHalf,th,'chamber',1],
    [k.roomLeft,y-k.roomHalf,k.roomLeft,y+k.roomHalf,th,'chamber',1],
    [k.roomRight,y-k.roomHalf,k.roomRight,y-k.doorHalf,th,'chamber',1],
    [k.roomRight,y+k.doorHalf,k.roomRight,y+k.roomHalf,th,'chamber',1]);
   if(g.keyOpen<.97)
    segments.push([k.gateX,y-k.doorHalf,k.gateX,y+k.doorHalf,th,'chamber-door',1]);
  }
 }else if(kind==='night'&&g.joined){
  for(const row of NIGHT_ROWS){
   const y=worldY(row.at,t);
   if(y<top()-rad()*3||y>bottom()+rad()*3)continue;
   const gap=nightGap(row);
   segments.push([4,y,gap.lo,y,th,row.id,2],[gap.hi,y,W-4,y,th,row.id,2]);
  }
 }
 return segments;
}
function isSolid(n,x,y,t=g.t){
 const r=rad()+wall()*.5-.2,kind=stage(t);
 return barriers(t,kind).some(s=>(kind==='night'||s[6]===n)&&segSq(x,y,s[0],s[1],s[2],s[3])<r*r);
}
function state(){
 return {mode:g.mode,t:g.t,real:g.real,phase:stage(g.t),pace:PACE,gain:GAIN,paused:g.paused,joined:g.joined,
 balls:g.balls.map(x=>({...x})),one:{...g.one},energy:[...g.energy],shared:g.shared,
 score:g.score,coins:[...g.coins],fireflies:[...g.fireflies],keyOpen:g.keyOpen,keyArmed:g.keyArmed,keyDone:g.keyDone,
 keyCross:g.keyCross,chamberEntered:g.chamberEntered,chamberCollected:g.chamberCollected,
 wind:g.wind.slice(),windForce:windForce(),worldPixelsPerSecond:speed()*PACE,joinTime:g.joinTime,healEnergy:g.healEnergy,healDistance:g.healDistance,healCharge:g.healCharge,
 nightCleared:[...g.nightCleared],nightApproached:[...g.nightApproached],duskTouched:[...g.duskTouched],
 lastMergedGesture:g.lastMergedGesture,lastCoralNearGate:g.lastCoralNearGate,
 hits:g.hits,fail:g.fail,completed:g.completed,finished:g.finished,gestureCount:[...g.gestureCount]};
}
function reset(){
 g={mode:'ready',t:0,real:0,paused:false,joined:false,balls:[
  {x:W*.25,y:heroY()},{x:W*.75,y:heroY()}],one:{x:W*.5,y:heroY()},
  energy:[100,100],shared:0,score:0,coins:[],fireflies:[],hits:0,lastHit:[-99,-99],hitLog:[],
  keyArmed:false,keyOpen:0,keyDone:false,keyCross:false,keyApproached:false,
  chamberApproach:false,chamberEntered:false,chamberCollected:false,wind:[0,0],
  duskTouched:[false,false],joinedInput:[-99,-99],joinTime:null,healEnergy:0,healCharge:0,healDistance:0,
  nightApproached:Array(NIGHT_ROWS.length).fill(false),nightCleared:Array(NIGHT_ROWS.length).fill(false),
  lastMergedGesture:-99,lastCoralNearGate:-99,
  gestureCount:[0,0],lastHud:-1,finished:false,completed:false,fail:null,tip:'Две светлини. Две пътеки.'};
 pads.forEach(p=>p.id=null);
 $('pause').textContent='Пауза';$('result').style.display='none';
 updateHud();draw();
}
function resize(){
 const ow=W,oh=H;
 W=Math.max(320,window.innerWidth||800);H=Math.max(390,window.innerHeight||800);
 dpr=Math.min(1.5,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g&&ow>1&&oh>1){
  for(let n=0;n<2;n++){const b=g.balls[n],bd=bounds(n,g.t>=DAY_END);b.x=clamp(b.x*W/ow,...bd);b.y=clampY(b.y*H/oh);}
  g.one.x=clamp(g.one.x*W/ow,rad(),W-rad());g.one.y=clampY(g.one.y*H/oh);
  g.keyArmed=false;g.duskTouched=[false,false];updateHud();draw();
 }else reset();
}
function hit(n,amount,reason){
 if(g.real-g.lastHit[n]<.82)return;
 g.lastHit[n]=g.real;g.hits++;
 if(g.joined){
  g.shared=Math.max(0,g.shared-amount);
  g.energy=[g.shared,g.shared];
 }else g.energy[n]=Math.max(0,g.energy[n]-amount);
 g.hitLog.push({time:g.t,n,amount,reason});
 if(g.joined&&g.shared<=0)finish(false,'Общата ви светлина угасна');
}
function pick(n,px,py){
 if(stage(g.t)!=='day'||g.joined)return;
 for(const coin of COINS){
  if(coin.side!==n||g.coins.includes(coin.id))continue;
  const x=coin.x*W,y=worldY(coin.at);
  if(dist(px,py,x,y)<rad()+12){
   g.coins.push(coin.id);g.score+=coin.value;
   g.tip=coin.value===3?'Златна искра! Всяко решение има цена.':'Събран доход · ✦'+g.score;
  }
 }
}
function blueKey(){
 const k=keyGeom(),b=g.balls[0],r=rad();
 return b.x>=k.keyLeft+r*.16&&b.x<=k.keyRight-r*.45
  &&Math.abs(b.y-k.y)<k.roomHalf*.68;
}
function coralChamberMove(){
 if(g.joined||g.keyDone||stage(g.t)!=='day')return;
 const k=keyGeom(),b=g.balls[1],r=rad();
 const aligned=Math.abs(b.y-k.y)<k.doorHalf-r*.75;
 if(!g.chamberApproach&&aligned&&b.x>=k.gateX+r*.75)g.chamberApproach=true;
 if(g.chamberApproach&&!g.chamberEntered&&aligned&&g.keyOpen>=.97&&b.x<=k.gateX-r*.75)
  g.chamberEntered=true;
 if(g.chamberEntered&&!g.chamberCollected&&dist(b.x,b.y,k.starX,k.y)<r+11)
  g.chamberCollected=true;
 if(g.chamberEntered&&g.chamberCollected&&!g.keyDone&&aligned&&b.x>=k.gateX+r*.75){
  g.keyDone=true;g.score+=8;g.energy=g.energy.map(v=>Math.min(100,v+6));
  g.tip='Заедно: Синя отключи, Корал върна искрата · ✦8';
 }
}
function maybeJoin(n){
 if(g.joined||stage(g.t)!=='dusk')return;
 const b=g.balls[n],threshold=rad()*2.5;
 if(Math.hypot(b.x-W*.5,b.y-heroY())<rad()*3.8)g.duskTouched[n]=true;
 if(!g.duskTouched.every(Boolean))return;
 if(dist(g.balls[0].x,g.balls[0].y,g.balls[1].x,g.balls[1].y)>threshold)return;
 g.joined=true;g.joinTime=g.t;
 g.one={x:(g.balls[0].x+g.balls[1].x)*.5,y:(g.balls[0].y+g.balls[1].y)*.5};
 g.shared=clamp((g.energy[0]+g.energy[1])*.5+12,0,100);
 g.energy=[g.shared,g.shared];
 g.joinedInput=[-99,-99];g.lastMergedGesture=-99;g.tip='♡ Една светлина. Движете двата палеца заедно.';
}
function healStroke(n,distance){
 if(!g.joined||g.healCharge>=28||g.t>902)return;
 g.joinedInput[n]=g.real;
 if(Math.abs(g.joinedInput[0]-g.joinedInput[1])>.9)return;
 const bx=W*.5,by=worldY(832),range=clamp(height()*.22,54,88);
 if(dist(g.one.x,g.one.y,bx,by)>range)return;
 const amount=Math.min(Math.max(0,distance),12);
 if(amount<.2)return;
 g.healDistance+=amount;
 const target=Math.min(28,Math.floor(g.healDistance/4));
 const bonus=target-g.healCharge;
 if(bonus>0){
  g.healCharge=target;
  const actual=Math.max(0,Math.min(bonus,100-g.shared));
  g.shared+=actual;g.healEnergy+=actual;g.energy=[g.shared,g.shared];
  g.tip='♡ Възстановявате силите си заедно';
 }
}
function pickupNight(n){
 if(!g.joined||stage(g.t)==='day')return;
 for(const item of FIREFLIES){
  if(g.fireflies.includes(item.id))continue;
  if(dist(g.one.x,g.one.y,item.x*W,worldY(item.at))<rad()+14){
   g.fireflies.push(item.id);g.shared=Math.min(100,g.shared+4);
   g.energy=[g.shared,g.shared];
   g.tip='Нощна светлинка · +4 обща енергия';
  }
 }
}
function move(n,dx,dy){
 if(g.mode!=='playing'||g.paused||Math.hypot(dx,dy)<.4)return;
 g.gestureCount[n]++;
 if(g.joined){
  // Both thumbs steer ONE orb. Same-direction gestures add; opposite gestures
  // cancel, so two matching movements preserve the exact x2.50 thumb gain.
  // No joystick offset, inertia or hidden acceleration.
  g.lastMergedGesture=g.real;
  const b=g.one,r=rad(),ddx=dx*.5,ddy=dy*.5;
  const steps=Math.max(1,Math.min(900,Math.ceil(Math.max(Math.abs(ddx),Math.abs(ddy))/Math.max(2,r*.34))));
  for(let i=0;i<steps;i++){
   const x=b.x;b.x=clamp(x+ddx/steps,r,W-r);
   if(isSolid(2,b.x,b.y)){b.x=x;hit(0,3,'night-arch');}
   const y=b.y;b.y=clampY(y+ddy/steps);
   if(isSolid(2,b.x,b.y)){b.y=y;hit(0,3,'night-arch');}
  }
  healStroke(n,Math.hypot(ddx,ddy));pickupNight(n);
 }else{
  const b=g.balls[n],r=rad(),range=bounds(n,stage(g.t)==='dusk');
  const steps=Math.max(1,Math.min(900,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/Math.max(2,r*.34))));
  for(let i=0;i<steps;i++){
   const ox=b.x;b.x=clamp(b.x+dx/steps,range[0],range[1]);
   if(stage(g.t)==='day'&&isSolid(n,b.x,b.y)){b.x=ox;hit(n,5,'day-wall');}
   const oy=b.y;b.y=clampY(b.y+dy/steps);
   if(stage(g.t)==='day'&&isSolid(n,b.x,b.y)){b.y=oy;hit(n,5,'day-wall');}
   if(n===0)g.keyArmed=stage(g.t)==='day'&&blueKey();
   if(n===1)coralChamberMove();

 // Render ONLY inside requestAnimationFrame, not on every touch event.

for(let n=0;n<2;n++){

  if(p.id!==null)return;event.preventDefault();
  p.id=event.pointerId;p.x=event.clientX;p.y=event.clientY;
  try{el.setPointerCapture(event.pointerId)}catch(_){}
  if(g.mode==='ready'&&pads.every(x=>x.id!==null))g.mode='playing';
 });
 el.addEventListener('pointermove',event=>{
  if(event.pointerId!==p.id)return;event.preventDefault();

 });
 for(const name of ['pointerup','pointercancel','lostpointercapture']){

function finish(success,title){

 ' · Енергия '+(g.joined?Math.round(g.shared):g.energy.map(x=>Math.round(x)).join(' / '));

function pushOut(n,oldT){
 const b=g.joined?g.one:g.balls[n],r=rad()+wall()*.5+.8;
 const segs=barriers(g.t);
 if(!isSolid(n,b.x,b.y))return;
 // A moving wall may push a light up, but never teleport it through itself.
 const relevant=segs.filter(s=>s[6]===n||(g.joined&&s[6]===2));
 if(!relevant.length)return;
 const closest=relevant.filter(s=>Math.abs(s[1]-b.y)<r+2).sort((a,c)=>Math.abs(a[1]-b.y)-Math.abs(c[1]-b.y))[0];
 if(!closest)return;
 const yOld=closest[1]+(g.t-oldT)*speed();
 // If wall came from below, keep orb on the upper side.
 const direction=yOld>=b.y?-1:(b.y<closest[1]?-1:1);
 b.y=clampY(closest[1]+direction*(r+1.6));
 hit(n,g.joined?3:5,'moving-wall');
}
function update(dt){
 if(g.mode!=='playing'||g.paused)return;
 const secs=Math.min(25,Math.max(0,dt)),num=Math.max(1,Math.ceil(secs/.02)),per=secs/num;
 for(let i=0;i<num&&g.mode==='playing';i++){
  const prev=g.t,phaseBefore=stage(g.t);
  g.real+=per;g.t=Math.min(END,g.t+per*PACE);
  const current=stage(g.t);
  if(!g.joined){
   // Equal daily fatigue, differences only from player choices and hazards.
   if(prev<DAY_END)for(let n=0;n<2;n++)g.energy[n]=Math.max(0,g.energy[n]-.24*per);
   if(g.energy.every(v=>v<=0)){finish(false,'Денят ви изтощи');break;}
  }
  if(current==='day'){
   if(!blueKey())g.keyArmed=false;
   g.keyOpen=clamp(g.keyOpen+(g.keyArmed?per/.16:-per/.22),0,1);
   // Three Day-13 v2 wind bands, same strong speed factors.
   g.wind=[0,0];
   for(let n=0;n<2;n++){
    const ball=g.balls[n],band=windAt(ball.y),range=bounds(n);
    if(!band)continue;
    const force=band.sign[n]*windForce()*band.strength;
    g.wind[n]=force;ball.x=clamp(ball.x+force*per,range[0],range[1]);
    if(windSpike(ball.x,ball.y))hit(n,9,'wind-spikes');
   }
   for(let n=0;n<2;n++)pushOut(n,prev);
  
  }else if(current==='dusk'&&!g.joined){
   // World continues even when the player delays the reunion.
   for(let n=0;n<2;n++){const b=g.balls[n],range=bounds(n,true);b.x=clamp(b.x,range[0],range[1]);}
  }else if(current==='night'&&g.joined){
   for(let j=0;j<NIGHT_ROWS.length;j++){
    const row=NIGHT_ROWS[j],before=worldY(row.at,prev),after=worldY(row.at),gap=nightGap(row),b=g.one,r=rad();
    // No fake "wiggle to count": physically occupy the generous hole.
    // The first two holes are disjoint, so cooperation requires a real
    // left-to-right movement instead of idle passage at centre.
    if(Math.abs(before-b.y)<r*4&&b.x>=gap.lo+r*.55&&b.x<=gap.hi-r*.55)
     g.nightApproached[j]=true;
    if(!g.nightCleared[j]&&g.nightApproached[j]&&after<b.y-r-wall()*.5)
     g.nightCleared[j]=true;
   }
   pushOut(2,prev);
  }
  if(!g.joined&&g.t>=DUSK_END){finish(false,'Не успяхте да се срещнете');break;}
  if(g.t>=END){
   const won=g.joined&&g.nightCleared.filter(Boolean).length>=5&&g.shared>=20;
   finish(won,won?'Денят и нощта — заедно ♡':'Опитайте още една нощ');
  }
 }
}

 $('energy0').style.color=phase==='night'?'#a7e2dc':'#538f8b';

 $('message').style.textShadow=phase==='night'?'0 2px 7px #141d39':'0 2px 8px #f7f0e6df';
 const msg=g.mode==='ready'?'Двата палеца стартират играта.':
 phase==='day'?(g.t<100?'Събирайте светлинките по двата маршрута.':
 g.t<290?'Пет различни пролуки — не са огледални.':
 g.t<580?(g.wind[0]>0?'→ СИЛЕН ВЯТЪР НАВЪТРЕ ← · бодли в центъра':
 g.wind[0]<0?'← СИЛЕН ВЯТЪР НАВЪН → · бодли по външните краища':
 'Вятърът сменя посоката три пъти.') :
 'Синя влиза в ключа ВЛЯВО, Корал в камерата ВДЯСНО.'):
 phase==='dusk'?(g.joined?'♡ Лекувайте се с ДВАТА палеца в светлата зона.':'♡ Срещнете двете светлини в центъра!'):
 'Една светлина · два палеца · седем широки, различни прохода.';
 $('message').textContent=(g.joined&&g.t<902&&g.healCharge<28)?'♡ В светлата зона движете ДВАТА палеца заедно · ♡+'+Math.round(g.healEnergy):msg;
}
function line(x,y,xx,yy,color,width=2){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();
}

function draw(){

 if(phase==='day'){

   if(y>=a&&y<=b)line(12,y,W-12,y,'#9eada01a',1);

 }else{
  for(let i=0;i<24;i++){
   const x=(Math.sin(i*31.17)*.5+.5)*W,y=a+((i*71+g.t*speed()*.20)%(height()+10));

 }
 ctx.save();ctx.beginPath();ctx.rect(0,a,W,b-a);ctx.clip();
 if(phase==='day'){

  // SK-01 v4 visual identity: joined brown room right + turquoise key left.

   ctx.fillStyle='#f5dfc682';

   ctx.strokeStyle='#528f84';ctx.lineWidth=2.4;

   line(k.keyX,k.y+r*.48,k.keyX+r*.30,k.y+r*.48,'#528f84',2.6);

   ctx.fillStyle=phase==='day'?'#7d8f90':'#edf0ff';
   if(low>=a-25&&low<b)ctx.fillText(band.label,W*.5,low-9);
   for(let yy=Math.ceil(from/47)*47;yy<to;yy+=47){
    for(let n=0;n<2;n++){
     const sign=band.sign[n],cx=n===0?W*.26:W*.74,span=clamp(W*.11,30,92);

    }else{
     ctx.beginPath();ctx.moveTo(W*.5-2,yy-10);ctx.lineTo(W*.5-reach,yy);ctx.lineTo(W*.5-2,yy+10);ctx.fill();
     ctx.beginPath();ctx.moveTo(W*.5+2,yy-10);ctx.lineTo(W*.5+reach,yy);ctx.lineTo(W*.5+2,yy+10);ctx.fill();

  for(let j=0;j<6;j++){const angle=j*TWO/6+g.real*.2;
   disc(W*.5+Math.cos(angle)*shine*.65,yy+Math.sin(angle)*shine*.65,3,'#ffedc7cc');}
 }
 if(phase==='night'){
  for(const [sx,sy,ex,ey,t] of barriers(g.t,'night')){

 ctx.restore();
 if(g.joined){
  const one=g.one;

function frame(ts){
