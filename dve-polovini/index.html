<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffaf4">
<title>Две половини — чисто управление</title>
<style>
:root{color-scheme:light;--teal:#72a5a4;--coral:#f49d85;--gold:#e5ac69;--ink:#334d49;--ivory:#fffdfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ivory);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--ivory);touch-action:none}
#playfield{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 9px);left:calc(env(safe-area-inset-left) + 13px);right:calc(env(safe-area-inset-right) + 13px);display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font-weight:850;font-size:clamp(14px,2.6vw,22px);letter-spacing:-.04em;white-space:nowrap;text-shadow:0 1px #fff}
.buttons{display:flex;gap:6px;pointer-events:auto;align-items:center}
.pill{border-radius:999px;background:#fffef3de;border:1px solid #dce4dc;box-shadow:0 1px 6px #324c4810;font-size:clamp(11px,1.8vw,14px);font-weight:800;padding:8px 10px;white-space:nowrap}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.small{border:1px solid #dce4dc;background:#fffcf6ee;color:var(--ink);border-radius:100px;font-size:13px;font-weight:750;padding:8px 12px;min-height:36px;touch-action:manipulation}
#status{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 57px);left:14%;right:14%;text-align:center;font-size:clamp(11px,1.8vw,14px);font-weight:750;line-height:1.35;color:#65877d;pointer-events:none;text-shadow:0 1px #fff}
#progress{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 85px);left:0;right:0;text-align:center;font-weight:800;font-size:clamp(12px,2vw,16px);color:#67847b;pointer-events:none}
.zone{position:absolute;bottom:0;z-index:5;height:34%;width:45%;min-height:148px;max-height:340px;touch-action:none;overscroll-behavior:contain}
#left-zone{left:0}#right-zone{right:0}
.pad{position:absolute;left:20px;top:20px;width:116px;height:116px;border-radius:50%;border:2px solid #ffffffd8;box-shadow:0 5px 24px #324a4214,inset 0 0 0 1px #ffffff64;pointer-events:none;transform:translate(-50%,-50%);will-change:left,top}
#left-pad{background:#cee4dfac}#right-pad{background:#f8dacf9e}
.pad:before,.pad:after{content:"";position:absolute;pointer-events:none;background:#577b7530}
.pad:before{top:15%;bottom:15%;left:50%;width:1px}.pad:after{top:50%;left:15%;right:15%;height:1px}
.knob{position:absolute;top:50%;left:50%;width:50%;height:50%;border:2px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 3px 12px #233d3b2a;will-change:transform}
#left-knob{background:var(--teal)}#right-knob{background:var(--coral)}
.zone .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 7px);font-weight:850;font-size:11px;letter-spacing:.05em;pointer-events:none;white-space:nowrap;opacity:.9}
#left-zone .hint{left:clamp(17px,7vw,85px);color:#5d928b}#right-zone .hint{right:clamp(17px,7vw,85px);color:#d88c75}
.mode-switch{background:#dff0e9;border-color:#bad6c8;font-weight:850}
.bottom-note{position:absolute;z-index:1;bottom:calc(env(safe-area-inset-bottom) + 9px);left:0;right:0;font-size:11px;font-weight:750;text-align:center;color:#82948a;pointer-events:none;opacity:.75}
@media(max-width:650px){.top{gap:4px;left:8px;right:8px}.brand{font-size:15px}.buttons{gap:4px}.pill{padding:7px 7px;font-size:11px}.small{padding:7px 8px;font-size:11px}#status{top:calc(env(safe-area-inset-top) + 52px);left:5%;right:5%}#progress{top:calc(env(safe-area-inset-top) + 79px)}.pad{width:98px;height:98px}#join{bottom:calc(env(safe-area-inset-bottom) + 19px);padding:9px 12px;font-size:11px}.zone{height:32%}.bottom-note{display:none}}
@media(max-height:560px){.zone{height:42%}.pad{width:96px;height:96px}.zone .hint{display:none}#join{bottom:calc(env(safe-area-inset-bottom) + 7px)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="playfield" aria-label="Пълноекранна игра Две половини"></canvas>
  <div class="top"><div class="brand">Две половини</div><div class="buttons"><span class="pill" id="score">★ 0</span><span class="pill" id="level">Тест</span><button class="small mode-switch" id="modebtn" type="button">▶ Игра</button><button class="small" id="fullscreen" type="button" title="Цял екран">⛶</button><button class="small" id="restart" type="button">↻</button></div></div>
  <div id="status" role="status" aria-live="polite">Раздалечи двата палеца, за да разделиш топчето ↙ ↘</div>
  <div id="progress">🩵 0/4 &nbsp; 🧡 0/4</div>
  <div class="zone" id="left-zone" aria-label="Управление на синьото топче"><div class="pad" id="left-pad"><div class="knob" id="left-knob"></div></div><div class="hint">ЛЯВ ПАЛЕЦ</div></div>
  <div class="zone" id="right-zone" aria-label="Управление на оранжевото топче"><div class="pad" id="right-pad"><div class="knob" id="right-knob"></div></div><div class="hint">ДЕСЕН ПАЛЕЦ</div></div>
  
  <div class="bottom-note">Ляв палец: синьо · десен палец: оранжево · сблъскай за съединяване</div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('playfield'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx){$('status').textContent='Невъзможно е да се стартира играта в този браузър.';return;}
const C={teal:'#72a5a4',coral:'#f49d85',gold:'#e5ac69'};
const sticks=[{x:0,y:0,id:null,downX:0,downY:0},{x:0,y:0,id:null,downX:0,downY:0}];
let practice=true;
let W=1,H=1,dpr=1,g,prev=0,keyboard={},animStarted=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const radius=()=>clamp(Math.min(W,H)*.026,16,23);
function say(text){$('status').textContent=text}
function refresh(){
 if(practice){
  $('score').textContent='✓ '+g.merges+' събирания';
  $('level').textContent='Тест';
  $('progress').textContent=g.mode==='joined'?'↙ Раздели с двата палеца ↘':'Сблъскай двете топчета · без магнит отдалеч';
 }else{
  $('score').textContent='★ '+g.score;
  $('level').textContent='Ниво '+g.level;
  $('progress').textContent=g.phase==='colors'?'🩵 '+g.teal+'/4　🧡 '+g.coral+'/4':'🟡 '+g.gold+'/3';
 }
 $('modebtn').textContent=practice?'▶ Игра':'◎ Тест';
}
function touchReset(which){
 const s=sticks[which];s.x=0;s.y=0;s.id=null;
 $(which?'right-knob':'left-knob').style.transform='translate(-50%,-50%)';
}
function defaultPads(){
 for(let n=0;n<2;n++){
  if(sticks[n].id!==null)continue;
  const zone=$(n?'right-zone':'left-zone'),r=zone.getBoundingClientRect(),pad=$(n?'right-pad':'left-pad');
  const size=pad.offsetWidth||110,localX=n?r.width-Math.max(65,size*.65):Math.max(65,size*.65),localY=r.height-Math.max(80,size*.64);
  pad.style.left=clamp(localX,size/2,r.width-size/2)+'px';
  pad.style.top=clamp(localY,size/2,r.height-size/2)+'px';
 }
}
function setupPad(n){
 const zone=$(n?'right-zone':'left-zone'),pad=$(n?'right-pad':'left-pad'),knob=$(n?'right-knob':'left-knob'),s=sticks[n];
 const act=(clientX,clientY)=>{
  const maxR=(pad.offsetWidth||116)*.37;
  const dx=clientX-s.downX,dy=clientY-s.downY;
  const len=Math.hypot(dx,dy);
  // Radial dead zone avoids diagonal bias and prevents jitter around the thumb.
  const dead=maxR*.10;
  const strength=len<=dead?0:Math.min(1,(len-dead)/(maxR-dead));
  s.x=len>0?dx/len*strength:0;
  s.y=len>0?dy/len*strength:0;
  const k=len>maxR?maxR/len:1;
  knob.style.transform='translate(-50%,-50%) translate('+(dx*k)+'px,'+(dy*k)+'px)';
 };
 const begin=(id,x,y)=>{
  if(s.id!==null)return false;
  s.id=id;s.downX=x;s.downY=y;s.x=0;s.y=0;
  const rect=zone.getBoundingClientRect(),sz=pad.offsetWidth||116;
  pad.style.left=clamp(x-rect.left,sz/2,rect.width-sz/2)+'px';
  pad.style.top=clamp(y-rect.top,sz/2,rect.height-sz/2)+'px';
  knob.style.transform='translate(-50%,-50%)';return true;
 };
 const end=()=>{touchReset(n);defaultPads()};
 if(window.PointerEvent){
  zone.addEventListener('pointerdown',e=>{
   e.preventDefault();if(begin(e.pointerId,e.clientX,e.clientY))try{zone.setPointerCapture(e.pointerId)}catch(_){ }
  });
  zone.addEventListener('pointermove',e=>{if(s.id===e.pointerId){e.preventDefault();act(e.clientX,e.clientY)}});
  for(const eventName of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(eventName,e=>{if(s.id===e.pointerId)end()});
  window.addEventListener('pointerup',e=>{if(s.id===e.pointerId)end()});
 }else{
  zone.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)if(begin(t.identifier,t.clientX,t.clientY))break},{passive:false});
  zone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===s.id)act(t.clientX,t.clientY)},{passive:false});
  const stop=e=>{for(const t of e.changedTouches)if(t.identifier===s.id){end();break}};
  zone.addEventListener('touchend',stop);zone.addEventListener('touchcancel',stop);
 }
 zone.addEventListener('contextmenu',e=>e.preventDefault());
}
setupPad(0);setupPad(1);
function resetGame(){
 const r=radius();
 g={level:1,score:0,merges:0,splits:0,phase:'colors',mode:'joined',joined:{x:W*.5,y:H*.64},a:{x:W*.5-r*2,y:H*.64},b:{x:W*.5+r*2,y:H*.64},items:[],fx:[],teal:0,coral:0,gold:0,scroll:0,splitHold:0,joinHold:0,mergeLock:0,spawnTime:.9,spawnCount:0,time:0};
 for(let n=0;n<2;n++)touchReset(n);
 defaultPads();generateTargets();refresh();say(practice?'Тест на управлението: раздели, движи и сблъскай топчетата.':'Раздалечи двата палеца, за да разделиш топчето ↙ ↘');prev=0;
}
function generateTargets(){
 g.items=[];if(practice)return;
 for(let i=0;i<5;i++){
  if(g.phase==='colors'){
   g.items.push(newTarget('teal',.15+i*.115));
   g.items.push(newTarget('coral',.20+i*.112));
  }else g.items.push(newTarget('gold',.17+i*.125));
 }
}
function newTarget(type,fraction){
 const x=type==='teal'?W*(.09+Math.random()*.35):type==='coral'?W*(.56+Math.random()*.35):W*(.20+Math.random()*.60);
 const y=typeof fraction==='number'?H*fraction:-radius()*2;
 return {type,x:clamp(x,30,W-30),y,r:clamp(radius()*.54,10,14)};
}
function resize(){
 const oldW=W,oldH=H;
 W=Math.max(320,$('app').clientWidth||window.innerWidth||320);
 H=Math.max(360,$('app').clientHeight||window.innerHeight||360);
 dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g){
  for(const p of [g.joined,g.a,g.b,...g.items,...g.fx]){p.x=p.x/oldW*W;p.y=p.y/oldH*H;}
  g.joined.x=clamp(g.joined.x,radius(),W-radius());
  g.joined.y=clamp(g.joined.y,90,H-radius());
 }
 requestAnimationFrame(defaultPads);
}
resize();
// Test mode isolates the twin-stick interaction from targets and levels.
$('modebtn').addEventListener('click',()=>{practice=!practice;resetGame()});
$('restart').addEventListener('click',resetGame);
$('fullscreen').addEventListener('click',()=>{
 if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
 else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{
  say('За цял екран на iPad: Safari → Споделяне → Добавяне към началния екран');
 });
 else say('За цял екран на iPad: Safari → Споделяне → Добавяне към началния екран');
});
function move(p,v,dt){
 const rad=radius(),speed=clamp(Math.min(W,H)*.32,170,295);
 // The same number of pixels per second in every direction and orientation.
 const mag=Math.hypot(v.x,v.y),scale=mag>1?1/mag:1;
 p.x=clamp(p.x+v.x*scale*speed*dt,rad,W-rad);
 p.y=clamp(p.y+v.y*scale*speed*dt,112,H-rad-4);
}

function completeMerge(){
 g.mode='joined';g.mergeLock=.48;g.merges++;
 g.joined={x:(g.a.x+g.b.x)/2,y:(g.a.y+g.b.y)/2};
 say(practice?'Добре! Съединяване №'+g.merges+'. Раздели отново.':g.phase==='gold'?'Съединени! Събирай жълтите 🟡':'Съединени! Раздели пак когато поискаш.');
 refresh();
}

function particle(x,y,color){
 for(let i=0;i<7;i++){const angle=Math.PI*2*i/7;
  g.fx.push({x,y,vx:Math.cos(angle)*(30+Math.random()*44),vy:Math.sin(angle)*(30+Math.random()*44),life:.30,color});
 }
}
function collect(it){
 particle(it.x,it.y,C[it.type]);
 if(it.type==='teal')g.teal++;
 if(it.type==='coral')g.coral++;
 if(it.type==='gold')g.gold++;
 g.score+=it.type==='gold'?30:10;
}
function nextPhase(){
 if(g.phase==='colors'){
  g.phase='gold';g.gold=0;g.spawnTime=1;g.spawnCount=0;generateTargets();
  say('Цветовете са събрани! Приближи двата палеца навътре или натисни „Съедини“.');
 }else{
  g.level++;g.phase='colors';g.teal=0;g.coral=0;g.gold=0;g.spawnTime=1;g.spawnCount=0;generateTargets();
  say('Браво! Ниво '+g.level+' — раздели топчето и събирай цветовете.');
 }
 refresh();
}
function getStick(n){
 const s=sticks[n],v={x:s.x,y:s.y};
 // Keyboard option for testing and accessibility: WASD teal, arrows coral.
 if(n===0){v.x+=(keyboard.a?-1:0)+(keyboard.d?1:0);v.y+=(keyboard.w?-1:0)+(keyboard.s?1:0)}
 else{v.x+=(keyboard.ArrowLeft?-1:0)+(keyboard.ArrowRight?1:0);v.y+=(keyboard.ArrowUp?-1:0)+(keyboard.ArrowDown?1:0)}
 v.x=clamp(v.x,-1,1);v.y=clamp(v.y,-1,1);return v;
}
function update(dt){
 if(!g)return;
 g.time+=dt;g.scroll+=(H*.046)*dt;g.mergeLock=Math.max(0,g.mergeLock-dt);
 const l=getStick(0),r=getStick(1),rad=radius();
 if(g.mode==='joined'){
  // The left thumb takes priority while both touch; no averaging/cancellation.
  if(l.x<-.68&&r.x>.68&&g.mergeLock<=0){
   g.splitHold+=dt;
   if(g.splitHold>.135){
    const offset=rad*2.0,base=clamp(g.joined.x,rad+offset,W-rad-offset);
    g.mode='split';g.a={x:base-offset,y:g.joined.y};g.b={x:base+offset,y:g.joined.y};
    g.splits++;g.splitHold=0;g.mergeLock=.48;
    refresh();say(practice?'Движи независимо с двата палеца, после сблъскай топчетата.':'Разделени! Ляв палец = синьо, десен = оранжево.');
   }
  }else{
   g.splitHold=0;
   const la=Math.hypot(l.x,l.y),ra=Math.hypot(r.x,r.y);
   const v=la>.10?l:ra>.10?r:{x:0,y:0};
   move(g.joined,v,dt);
  }
 }else if(g.mode==='split'){
  const previous=distance(g.a,g.b);
  move(g.a,l,dt);move(g.b,r,dt);
  let gap=distance(g.a,g.b);
  const closing=previous-gap;
  // Only assist an intentional, already-near contact; do not pull across the screen.
  if(g.mergeLock<=0&&closing>.04){
   if(gap<rad*3.5&&gap>rad*2){
    const pull=Math.min(37*dt,(gap-rad*2)*.28);
    const ux=(g.b.x-g.a.x)/gap,uy=(g.b.y-g.a.y)/gap;
    g.a.x+=ux*pull;g.a.y+=uy*pull;
    g.b.x-=ux*pull;g.b.y-=uy*pull;
    gap=distance(g.a,g.b);
   }
   if(gap<=rad*2+5)completeMerge();
  }
 }
 if(!practice){
  g.spawnTime-=dt;
  if(g.spawnTime<=0){
   g.spawnTime=1.1;
   if(g.items.length<18){
    let typ;
    if(g.phase==='gold')typ='gold';
    else{const choices=[];if(g.teal<4)choices.push('teal');if(g.coral<4)choices.push('coral');typ=choices.length?choices[g.spawnCount%choices.length]:null;}
    if(typ)g.items.push(newTarget(typ));g.spawnCount++;
   }
  }
  const keep=[];let picked=false;
  for(const it of g.items){
   it.y+=H*.063*dt;
   if(it.y>H+30)continue;
   const target=it.type==='gold'&&g.mode==='joined'?g.joined:it.type==='teal'&&g.mode==='split'?g.a:it.type==='coral'&&g.mode==='split'?g.b:null;
   if(target&&distance(target,it)<rad+it.r+4){collect(it);picked=true;}
   else keep.push(it);
  }
  g.items=keep;
  if(picked)refresh();
  if(g.phase==='colors'&&g.teal>=4&&g.coral>=4||g.phase==='gold'&&g.gold>=3)nextPhase();
 }
 for(let i=g.fx.length-1;i>=0;i--){const f=g.fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)g.fx.splice(i,1)}
}

function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function joinedBall(x,y,r){
 ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle=C.teal;ctx.fillRect(x-r,y-r,r,2*r);ctx.fillStyle=C.coral;ctx.fillRect(x,y-r,r,2*r);ctx.restore();
 ctx.lineWidth=2.5;ctx.strokeStyle='#fffefa';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
}
function draw(){
 if(!g)return;
 ctx.fillStyle='#fffdfa';ctx.fillRect(0,0,W,H);
 const mid=W/2,top=95;
 ctx.fillStyle='#f3f9f6';ctx.fillRect(0,top,mid-8,H-top);
 ctx.fillStyle='#fff7f1';ctx.fillRect(mid+8,top,mid-8,H-top);
 ctx.fillStyle='#fffdfa';ctx.fillRect(mid-8,top,16,H-top);
 // Scrolling guides create the sensation of continuous upward travel.
 for(let j=0;j<14;j++){
  const gap=H/7,y=top+j*gap-(g.scroll%gap);
  if(y<top||y>H+5)continue;
  ctx.strokeStyle='#77a79d18';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(W*.06,y);ctx.lineTo(mid-W*.04,y);
  ctx.moveTo(mid+W*.04,y);ctx.lineTo(W*.94,y);ctx.stroke();
  ctx.globalAlpha=.15;circle(W*.07,y-12,4.5,C.teal);circle(W*.93,y-12,4.5,C.coral);ctx.globalAlpha=1;
 }
 ctx.setLineDash([3,10]);ctx.strokeStyle='#b9cfc8b7';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(mid,top);ctx.lineTo(mid,H);ctx.stroke();ctx.setLineDash([]);
 const rad=radius();
 for(const it of g.items){
  if(it.y<top-8)continue;
  const col=C[it.type];ctx.globalAlpha=.14;circle(it.x,it.y,it.r+6,col);ctx.globalAlpha=1;
  circle(it.x,it.y,it.r,col);circle(it.x-3,it.y-3,2.3,'#fff9');
 }
 if(g.mode==='joined')joinedBall(g.joined.x,g.joined.y,rad);
 else{
  // A quiet line shows the two halves without automatic joining.
  ctx.strokeStyle='#89ada348';
  ctx.setLineDash([4,9]);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);ctx.stroke();ctx.setLineDash([]);
  circle(g.a.x,g.a.y,rad,C.teal);circle(g.b.x,g.b.y,rad,C.coral);
  circle(g.a.x-rad*.28,g.a.y-rad*.32,3.3,'#ffffffab');circle(g.b.x-rad*.28,g.b.y-rad*.32,3.3,'#ffffffab');
 }
 for(const f of g.fx){ctx.globalAlpha=Math.max(0,f.life/.30);circle(f.x,f.y,3.5,f.color)}ctx.globalAlpha=1;
}
function frame(t){
 if(!prev)prev=t;
 const dt=Math.min(.05,Math.max(0,(t-prev)/1000));prev=t;
 update(dt);draw();requestAnimationFrame(frame);
}
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('orientationchange',()=>{setTimeout(resize,100)},{passive:true});
document.addEventListener('visibilitychange',()=>{prev=0;if(document.hidden){keyboard={};for(let i=0;i<2;i++)touchReset(i)}});
window.addEventListener('blur',()=>{prev=0;keyboard={};for(let i=0;i<2;i++)touchReset(i)});
window.addEventListener('pagehide',()=>{prev=0;for(let i=0;i<2;i++)touchReset(i)});
window.addEventListener('keydown',e=>{if(['a','s','w','d','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){keyboard[e.key]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{keyboard[e.key]=false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
resetGame();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
