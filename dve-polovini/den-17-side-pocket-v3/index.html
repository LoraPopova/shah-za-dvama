<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f1e8">
<title>Две половини · Ден 17 — U-джобове v3 · огледален модул</title>
<style>
:root{--paper:#f5f1e8;--ink:#41534e;--teal:#67a8a3;--coral:#ef9882}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--paper);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:3}
#brand{font-size:10px;font-weight:850;letter-spacing:2px;color:#83978f}
h1{font-size:20px;margin:4px 0;color:#44544f}
#status{font-size:12px;color:#728981;font-weight:700;margin:4px 0}
#stats{display:flex;gap:15px;align-items:center;text-align:right;font-size:13px;font-weight:700}
#stats div{white-space:nowrap}
#score{color:#b88e42}
#boostClock{color:#bf8746;min-width:66px}
#e0{color:#568f89}#e1{color:#d48371}
#progress{position:fixed;left:0;right:0;top:calc(94px + env(safe-area-inset-top,0px));height:4px;background:#d9ddd2;z-index:3}
#bar{height:100%;width:0;background:linear-gradient(90deg,#70aaa2,#e7a48f)}
#menu{position:fixed;top:calc(110px + env(safe-area-inset-top,0px));left:18px;display:flex;gap:8px;z-index:6}
button{border:1px solid #dfdfd5;border-radius:99px;padding:9px 15px;background:#fffffff2;color:#52665e;box-shadow:0 4px 15px #4d5f4a16;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
#hint{position:fixed;top:calc(156px + env(safe-area-inset-top,0px));left:15%;right:15%;text-align:center;pointer-events:none;font-size:14px;font-weight:750;color:#5e8089;z-index:3;text-shadow:0 1px 4px #f5f1e8}
.pad{position:fixed;bottom:calc(clamp(80px,14vh,185px) + env(safe-area-inset-bottom,0px));width:130px;height:130px;border:2px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;z-index:5;box-shadow:inset 0 0 0 10px #ffffff44}
.pad.left{left:calc(25% - 65px);border-color:#84b5ae;background:#85c0b21b}
.pad.right{left:calc(75% - 65px);border-color:#f1b5a4;background:#e8a68a1b}
.knob{height:43px;width:43px;border-radius:50%;pointer-events:none;box-shadow:0 3px 12px #62615733}
.left .knob{background:#7caca6}.right .knob{background:#eda18c}
.pad span{position:absolute;bottom:13px;color:#899890;letter-spacing:.5px;font-size:9px;font-weight:800}
#finish{position:fixed;inset:0;background:#f5f1e8eb;z-index:12;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#finish .inner{max-width:380px;background:white;border-radius:24px;padding:26px 24px;border:1px solid #e7e5dd;box-shadow:0 18px 45px #45544d24}
#finish h2{font-size:25px;margin:0 0 12px}#finish p{font-size:15px;line-height:1.4}#finish button{background:#4f8d84;color:white;border:0;font-size:15px;padding:13px 24px}
@media(max-width:680px){
header{left:12px;right:12px}h1{font-size:16px}
#stats{font-size:10px;gap:6px;align-items:start}
#status{font-size:10px;max-width:210px}
#menu{left:12px}#hint{font-size:12px;left:6%;right:6%}
.pad{width:105px;height:105px}.pad.left{left:calc(25% - 52px)}.pad.right{left:calc(75% - 52px)}
}
@media(max-height:580px){.pad{bottom:calc(40px + env(safe-area-inset-bottom,0px))}#progress{top:85px}#menu{top:97px}#hint{top:145px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<header>
<div><div id="brand">TWO HALVES · СКИЦА №4</div><h1>Ден 17 · Огледални U-джобове</h1><div id="status">Два U-джоба: първо Синя вляво, после Корал вдясно. Различна височина.</div></div>
<div id="stats"><div id="e0">● Синя 100</div><div id="e1">● Корал 100</div><div id="score">✦ 0</div><div id="boostClock">×5</div></div>
</header>
<div id="progress"><div id="bar"></div></div>
<div id="menu"><button id="reset">Отначало</button><button id="pause">Пауза</button></div>
<div id="hint">Първо ляв висок U, после десен по-нисък U. И двата се скролват с ×5.</div>
<div class="pad left" id="pad0"><div class="knob" id="knob0"></div><span>ЛЯВ ПАЛЕЦ</span></div>
<div class="pad right" id="pad1"><div class="knob" id="knob1"></div><span>ДЕСЕН ПАЛЕЦ</span></div>
<div id="finish"><div class="inner"><h2 id="outcome">Край на деня</h2><p id="result"></p><button id="again">Играй отново</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const COLORS=['#67a8a3','#ef9882'],GAIN=2.5,PACE=5,DURATION=145,COIN_R=8;
const SCROLL_RATE=.016,MAX_WORLD_STEP=.02;
let W=1,H=1,dpr=1,g=null,prevFrame=0;
const pads=[{id:null,x:0,y:0,el:$('pad0')},{id:null,x:0,y:0,el:$('pad1')}];
// LEVEL DESIGN CONFIGURATION: add, reorder, resize, or mirror any U.
// side: "left"/"right"; height: fraction of visible playH (e.g. 0.27..0.48);
// width: fraction of that SIDE'S half-screen; at: when U reaches lower play area.
// These are design parameters, NOT controls affecting the two-thumb movement.
const POCKETS=Object.freeze([
 Object.freeze({id:'leftTall',side:'left',height:.42,width:.77,at:16}),
 Object.freeze({id:'rightShort',side:'right',height:.27,width:.73,at:76})
]);
const rad=()=>clamp(Math.min(W,H)*.019,11,19);
const upper=()=>Math.max(110,H*.16);
const lower=()=>Math.max(upper()+90,Math.min(H*.69,H-145));
const playH=()=>lower()-upper();
const lane=n=>n===0?[rad(),W*.5-rad()]:[W*.5+rad(),W-rad()];
const thick=()=>clamp(Math.min(W,H)*.010,5,9);
const sideNum=p=>p.side==='left'?0:1;
const outwardSign=p=>p.side==='left'?1:-1;
function geom(p,time=g.time){
 const xSpan=(W*.5)*clamp(p.width,.25,.87);
 const chosenHeight=clamp(p.height,.22,.60);
 const minimumHalf=rad()*(2.32+Math.max(0,chosenHeight-.27)*8)+thick()*.6;
 const half=Math.max(minimumHalf,Math.min(playH()*chosenHeight*.5,118));
 const x0=p.side==='left'?1:W-1-xSpan;
 const x1=p.side==='left'?1+xSpan:W-1;
 const mouth=p.side==='left'?x1:x0;
 const back=p.side==='left'?x0:x1;
 const cy=upper()+playH()*(.86+(p.at-time)*SCROLL_RATE);
 return {id:p.id,side:p.side,x0,x1,mouth,back,cy,half,width:xSpan,height:2*half};
}
function segments(p,time=g.time){
 const a=geom(p,time),t=thick();
 return [[a.x0,a.cy-a.half,a.x1,a.cy-a.half,t],
         [a.x0,a.cy+a.half,a.x1,a.cy+a.half,t],
         [a.back,a.cy-a.half,a.back,a.cy+a.half,t]];
}
function segDistSq(x,y,x0,y0,x1,y1){
 const dx=x1-x0,dy=y1-y0,len=dx*dx+dy*dy;
 const u=len?clamp(((x-x0)*dx+(y-y0)*dy)/len,0,1):0;
 return (x-x0-dx*u)**2+(y-y0-dy*u)**2;
}
function blocked(n,x,y,time=g.time){
 const rr=rad()+thick()*.5-.25;
 return POCKETS.some(p=>sideNum(p)===n&&segments(p,time)
   .some(([a,b,c,d])=>segDistSq(x,y,a,b,c,d)<rr*rr));
}
const ITEMS=POCKETS.flatMap(p=>{
 const side=sideNum(p),other=1-side,mirror=outwardSign(p);
 const pocketItems=[
  {id:p.id+'-near',pid:p.id,n:side,kind:'pocket',xf:.78,yf:-.30,value:1},
  {id:p.id+'-middle',pid:p.id,n:side,kind:'pocket',xf:.46,yf:.32,value:1},
  {id:p.id+'-gold',pid:p.id,n:side,kind:'pocket',xf:.20,yf:0,value:3}
 ];
 const safeX=other===0?[.30,.41]:[.70,.84];
 return pocketItems.concat([
  {id:p.id+'-safeA',pid:p.id,n:other,kind:'safe',xf:safeX[0],yf:-1.15,value:1},
  {id:p.id+'-safeB',pid:p.id,n:other,kind:'safe',xf:safeX[1],yf:1.15,value:1}
 ]);
});
function itemPos(item,time=g.time){
 const p=POCKETS.find(p=>p.id===item.pid),a=geom(p,time);
 if(item.kind==='safe')return {x:W*item.xf,y:a.cy+a.half*item.yf};
 const innerX=p.side==='left'?a.x0+a.width*item.xf:a.x1-a.width*item.xf;
 return {x:innerX,y:a.cy+a.half*item.yf};
}
function reset(){
 g={mode:'ready',paused:false,time:0,realTime:0,pace:PACE,
  balls:[{x:W*.46,y:upper()+playH()*.24},{x:W*.56,y:upper()+playH()*.24}],
  energy:[100,100],score:0,taken:[],hits:0,lastHit:[-99,-99],
  pocket:Object.fromEntries(POCKETS.map(p=>[p.id,{armed:false,entered:false,taken:0,escaped:false}])),
  finished:false,crushed:false};
 pads.forEach(p=>p.id=null);$('finish').style.display='none';$('pause').textContent='Пауза';
 $('hint').textContent='Синя — ляв висок U. Корал — огледален десен U. Събери и излез.';
 refresh();draw();
}
function state(){
 return {mode:g.mode,paused:g.paused,time:g.time,realTime:g.realTime,pace:g.pace,gain:GAIN,
  balls:g.balls.map(b=>({...b})),energy:g.energy.slice(),score:g.score,taken:[...g.taken],
  pocket:Object.fromEntries(POCKETS.map(p=>[p.id,{...g.pocket[p.id]}])),
  pockets:POCKETS.map(p=>({...geom(p),at:p.at,requestedHeight:p.height,requestedWidth:p.width,segments:segments(p)})),
  items:ITEMS.map(i=>({...i,...itemPos(i),taken:g.taken.includes(i.id)})),
  hits:g.hits,crushed:g.crushed,finished:g.finished};
}
function resize(){
 const ow=W,oh=H;
 W=Math.max(320,window.innerWidth||800);H=Math.max(390,window.innerHeight||800);
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g&&ow>1&&oh>1){
  g.balls.forEach((b,n)=>{const l=lane(n);b.x=clamp(b.x*W/ow,l[0],l[1]);b.y=clamp(b.y*H/oh,upper()+rad(),lower()-rad());});
  draw();refresh();
 }else reset();
}
function refresh(){
 $('e0').textContent='● Синя '+Math.round(g.energy[0]);
 $('e1').textContent='● Корал '+Math.round(g.energy[1]);
 $('score').textContent='✦ '+g.score;
 $('boostClock').textContent='×'+g.pace;
 $('bar').style.width=Math.min(100,g.time/DURATION*100)+'%';
 if(g.mode==='ready')$('status').textContent='Два палеца за старт · първо висок ляв, после нисък десен U.';
 else if(g.mode==='done')$('status').textContent='Край на участъка';
 else if(g.paused)$('status').textContent='Пауза';
 else $('status').textContent=(g.pocket.leftTall.escaped?'Ляв ✓ · ':'')+
  (g.pocket.rightShort.escaped?'Десен ✓ · ':'')+'скрол ×5';
}
function hit(n){
 if(g.realTime-g.lastHit[n]<.85)return;
 g.lastHit[n]=g.realTime;g.hits++;g.energy[n]=Math.max(0,g.energy[n]-5);
}
function checkPocket(n){
 // Only an active thumb movement may arm entry or complete escape.
 const b=g.balls[n],r=rad();
 for(const p of POCKETS){
  if(sideNum(p)!==n)continue;
  const a=geom(p),v=g.pocket[p.id];
  const aligned=Math.abs(b.y-a.cy)<a.half-r*1.13;
  if(!aligned)continue;
  // Inward is positive on BOTH sides, creating exact left/right mirror logic.
  const inward=(a.mouth-b.x)*outwardSign(p);
  if(!v.entered){
   if(inward<=-r*.65)v.armed=true;
   if(v.armed&&inward>=r*.65)v.entered=true;
  }
  if(v.entered&&!v.escaped&&v.taken>0&&inward<=-r*.65){
   v.escaped=true;g.score+=2;
   $('hint').textContent=(n===0?'Синя':'Корал')+' излезе успешно! ✦2';
  }
 }
}
function collect(n){
 const b=g.balls[n],r=rad();
 for(const i of ITEMS){
  if(i.n!==n||g.taken.includes(i.id))continue;
  if(i.kind==='pocket'&&!g.pocket[i.pid].entered)continue;
  const p=itemPos(i),range=r+COIN_R+2;
  if((b.x-p.x)**2+(b.y-p.y)**2>range*range)continue;
  g.taken.push(i.id);g.score+=i.value;
  if(i.kind==='pocket')g.pocket[i.pid].taken++;
  if(i.value===3)$('hint').textContent='✦3 златна искра · върни се през отвора!';
 }
}
function move(n,dx,dy){
 if(g.mode!=='playing'||g.paused)return;
 const b=g.balls[n],l=lane(n),r=rad();
 const steps=Math.max(1,Math.min(1000,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/Math.max(2,r*.32))));
 for(let i=0;i<steps;i++){
  const ox=b.x;b.x=clamp(ox+dx/steps,l[0],l[1]);
  if(blocked(n,b.x,b.y)){b.x=ox;hit(n);}
  const oy=b.y;b.y=clamp(oy+dy/steps,upper()+r,lower()-r);
  if(blocked(n,b.x,b.y)){b.y=oy;hit(n);}
  checkPocket(n);collect(n);
 }
 refresh();draw();
}
for(let n=0;n<2;n++){
 const p=pads[n],el=p.el;
 el.addEventListener('pointerdown',e=>{
  if(p.id!==null)return;e.preventDefault();p.id=e.pointerId;p.x=e.clientX;p.y=e.clientY;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(g.mode==='ready'&&pads.every(v=>v.id!==null))g.mode='playing';
 });
 el.addEventListener('pointermove',e=>{
  if(e.pointerId!==p.id)return;e.preventDefault();
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  move(n,dx*GAIN,dy*GAIN);
 });
 for(const kind of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(kind,e=>{if(e.pointerId!==p.id)return;p.id=null;try{el.releasePointerCapture(e.pointerId)}catch(_){}});
}
$('reset').addEventListener('click',reset);
$('again').addEventListener('click',reset);
$('pause').addEventListener('click',()=>{
 if(g.mode!=='playing')return;g.paused=!g.paused;
 $('pause').textContent=g.paused?'Продължи':'Пауза';refresh();
});
function finish(){
 if(g.finished)return;g.finished=true;g.mode='done';
 $('outcome').textContent=g.crushed?'ПРЕГРАДАТА ТЕ НАСТИГНА':'КРАЙ НА УЧАСТЪКА';
 const won=POCKETS.filter(p=>g.pocket[p.id].escaped).length;
 $('result').textContent='Събрани ✦'+g.score+' от възможни 18 · Успешни джобове '+won+'/2 · Енергия '+g.energy.map(x=>Math.round(x)).join(' / ')+'.';
 $('finish').style.display='flex';
}
function update(dt){
 if(g.mode!=='playing'||g.paused)return;
 const frames=Math.max(1,Math.ceil(Math.min(Math.max(0,dt),30)/MAX_WORLD_STEP));
 const step=Math.min(Math.max(0,dt),30)/frames;
 for(let i=0;i<frames&&g.mode==='playing';i++){
  const oldTime=g.time;g.realTime+=step;
  g.time=Math.min(DURATION,g.time+step*PACE);g.pace=PACE;
  for(let n=0;n<2;n++){
   const b=g.balls[n];
   if(!blocked(n,b.x,b.y))continue;
   const any=POCKETS.find(p=>sideNum(p)===n&&
    segments(p).some(([x0,y0,x1,y1])=>segDistSq(b.x,b.y,x0,y0,x1,y1)<(rad()+thick()*.5-.25)**2));
   if(!any)continue;
   const drift=geom(any).cy-geom(any,oldTime).cy;
   let tries=0;
   while(blocked(n,b.x,b.y)&&tries++<16){
    const next=clamp(b.y+drift,upper()+rad(),lower()-rad());
    if(Math.abs(next-b.y)<1e-5)break;
    b.y=next;
   }
   if(blocked(n,b.x,b.y)){
    hit(n);
    if(b.y<=upper()+rad()+.1){g.crushed=true;finish();}
   }
  }
  // Scroll does not collect a coin nor trigger the entry/exit condition.
  if(g.time>=DURATION)finish();
 }
 refresh();
}
function line(x,y,xx,yy,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill();}
function draw(){
 if(!g)return;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#f5f1e8';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#90bca90d';ctx.fillRect(0,0,W*.5,H);
 ctx.fillStyle='#f3a58b0f';ctx.fillRect(W*.5,0,W*.5,H);
 const top=upper(),bottom=lower(),r=rad();
 ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='#b9c8bf';ctx.strokeRect(12,top,W-24,bottom-top);ctx.restore();
 line(W*.5,top-14,W*.5,bottom+12,'#cfc6b9',1.5);
 for(let y=top+(g.time*3)%70-70;y<bottom;y+=70)if(y>=top)line(15,y,W-15,y,'#9caea31a',1);
 ctx.save();ctx.beginPath();ctx.rect(0,top,W,bottom-top);ctx.clip();
 for(const p of POCKETS){
  const a=geom(p),clr=sideNum(p)===0?'#72aaa5':'#bf8a7c';
  ctx.fillStyle=sideNum(p)===0?'#a3d3c526':'#f2b9a526';
  ctx.fillRect(a.x0,a.cy-a.half,a.x1-a.x0,a.half*2);
  for(const [x0,y0,x1,y1,w] of segments(p)){
   line(x0,y0,x1,y1,'#986b65',w+3);
   line(x0,y0,x1,y1,clr,w);
  }
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#9f7770';
  ctx.fillText(sideNum(p)===0?'СИНЯ · ВЛЕЗ И ИЗЛЕЗ':'КОРАЛ · ВЛЕЗ И ИЗЛЕЗ',
   (a.x0+a.x1)*.5,a.cy-a.half-13);
 }
 for(const i of ITEMS){
  if(g.taken.includes(i.id))continue;
  const at=itemPos(i);
  circle(at.x,at.y,i.value===3?COIN_R+9:COIN_R+5,'#f4c65a30');
  circle(at.x,at.y,i.value===3?COIN_R+3:COIN_R,i.value===3?'#e3ae47':'#eac96e');
  circle(at.x-2,at.y-2,2,'#fff7d7');
 }
 ctx.restore();
 for(let n=0;n<2;n++){
  const b=g.balls[n],grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*2.5);
  grad.addColorStop(0,COLORS[n]+'70');grad.addColorStop(1,COLORS[n]+'00');
  circle(b.x,b.y,r*2.5,grad);circle(b.x,b.y,r,COLORS[n]);
  circle(b.x-r*.24,b.y-r*.25,r*.17,'#ffffffb5');
 }
 if(g.mode==='ready'){
  ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillStyle='#69877a';
  ctx.fillText('ДВА ПАЛЕЦА = СТАРТ',W*.5,bottom+30);
 }
}
function frame(ts){
 if(!prevFrame)prevFrame=ts;
 const dt=Math.max(0,Math.min(.05,(ts-prevFrame)/1000));prevFrame=ts;
 if(g)update(dt);if(g)draw();requestAnimationFrame(frame);
}
window.__twoHalvesQA={state,advance:update,reset,move,collect,blocked,segments,geom,itemPos,checkPocket,resize,config:POCKETS};
window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
