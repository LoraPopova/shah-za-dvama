<style>

}

<body>
<canvas id="world"></canvas>
<header>
<div><div id="brand">TWO HALVES · СКИЦА №2</div><h1>Ден 16 · Ключ и врата v5</h1><div id="status">Както на скицата №2: ляв ключ → зелена врата вдясно.</div></div>
<div id="stats"><div id="e0">● Синя 100</div><div id="e1">● Корал 100</div><div id="score">✦ 0</div><div id="boostClock">ВРАТА 0%</div></div>
</header>
<div id="progress"><div id="bar"></div></div>
<div id="menu"><button id="reset">Отначало</button><button id="pause">Пауза</button><button id="skip" disabled>Пропусни</button></div>
<div id="bridgeMeter"><div id="bridgeFill"></div></div>
<div id="hint">Синя влиза в очертаното поле и докосва ключа. Корал минава през зелената врата.</div>
<div class="pad left" id="pad0"><div class="knob" id="knob0"></div><span>ЛЯВ ПАЛЕЦ</span></div>
<div class="pad right" id="pad1"><div class="knob" id="knob1"></div><span>ДЕСЕН ПАЛЕЦ</span></div>
<div id="finish"><div class="inner"><h2 id="outcome">Край на деня</h2><p id="result"></p><button id="again">Играй отново</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),C=['#67a8a3','#ef9882'];
const GAIN=2.5,BASE_PACE=5,SLOW_PACE=5,PUZZLE_AT=10,TOTAL=40,OPEN_SECONDS=.16,CLOSE_SECONDS=.22,KEY_EXIT_GRACE=.12;
let W=1,H=1,dpr=1,g=null,prevFrame=0;
const pads=[{id:null,x:0,y:0,el:$('pad0')},{id:null,x:0,y:0,el:$('pad1')}];
const radius=()=>clamp(Math.min(W,H)*.019,11,19);
const upper=()=>Math.max(110,H*.16);
const lower=()=>Math.max(upper()+90,Math.min(H*.69,H-145));
const lane=n=>n===0?[radius(),W*.5-radius()]:[W*.5+radius(),W-radius()];
const playH=()=>lower()-upper();
const gateY=(time=g.time)=>upper()+playH()*(.38+(PUZZLE_AT-time)*.015);
// Drawing #2: turquoise key chamber pressed near the central divider,
 // then the brown horizontal right-side wall interrupted by a GREEN gate.
 const keyX=()=>W*.4265;
 const gateX=()=>W*.763;
 const doorHalf=()=>clamp(W*.5*.12,23,65);
 const keyRadius=()=>clamp(Math.min(W,H)*.023,14,23);
 const wallR=()=>clamp(Math.min(W,H)*.012,7,12);
 const chamber=()=>({
   left:W*.353,right:W*.5,
   halfH:clamp(playH()*.19,39,62),
   entryHalf:clamp(radius()*2.45,27,44)
 });
const gateLeft=()=>gateX()-doorHalf();
const gateRight=()=>gateX()+doorHalf();
function keySegments(time=g.time){
 const b=chamber(),y=gateY(time),h=b.halfH,o=b.entryHalf;
 // One intentional opening in the left wall; outline is otherwise SOLID.
 return [
  [b.left,y-h,b.right,y-h,5],
  [b.left,y+h,b.right,y+h,5],
  [b.right,y-h,b.right,y+h,wallR()*1.75],
  [b.left,y-h,b.left,y-o,5],
  [b.left,y+o,b.left,y+h,5]
 ];
}
function solidKeyChamber(x,y,time=g.time){
 return keySegments(time).some(([a,b,c,d,w])=>
  segmentDistSq(x,y,a,b,c,d)<(radius()+w*.5-.3)**2);
}
function keyTouched(){
 const b=g.balls[0],y=gateY();
 const distance=Math.hypot(b.x-keyX(),b.y-y);
 // Hysteresis: enter at the actual key, but do not chatter at its edge.
 const threshold=g.keyHeld ? radius()+keyRadius()*1.52
                           : radius()+keyRadius()*.90;
 return distance<=threshold;
}
function segmentDistSq(x,y,x0,y0,x1,y1){
 const dx=x1-x0,dy=y1-y0,len=dx*dx+dy*dy;
 const u=len?clamp(((x-x0)*dx+(y-y0)*dy)/len,0,1):0;
 return (x-(x0+dx*u))**2+(y-(y0+dy*u))**2;
}
function solidGate(x,y,time=g.time){
 const yy=gateY(time),reach=radius()+wallR()*.52-.2;
 if(Math.abs(y-yy)>reach)return false;
 const segs=[[chamber().right,gateLeft()],[gateRight(),W-3]];
 if(g.open<.96)segs.push([gateLeft(),gateRight()]);
 return segs.some(([a,b])=>segmentDistSq(x,y,a,yy,b,yy)<reach*reach);
}
function unlock(){
 if(g.missed)return;
 if(!g.unlocked){g.unlocked=true;g.unlockCount++;}
 g.keyHeld=true;
 if(!g.done)$('hint').textContent='Синя е при ключа — свързаната зелена врата се отваря. Корал, премини!';
}
function syncKey(dt=0){
 if(g.missed)return;
 const held=keyTouched();
 if(held){
  g.keyExitTime=0;
  if(!g.keyHeld)unlock();
 }else if(g.keyHeld){
  // While the scene scrolls, let small thumb corrections happen without
  // rapid open/close flicker right at the key's detection boundary.
  g.keyExitTime+=dt;
  if(g.keyExitTime>=KEY_EXIT_GRACE){
   g.keyHeld=false;g.keyExitTime=0;
   if(!g.done)$('hint').textContent=g.gateTransit
    ? 'Синя напусна ключа — вратата изчаква Корал да излезе.'
    : 'Синя напусна ключа — зелената врата се затваря!';
  }
 }
}
function syncGateTransit(){
 const b=g.balls[1],r=radius(),yy=gateY();
 const insideX=b.x>=gateLeft()+r*.6&&b.x<=gateRight()-r*.6;
 const dist=Math.abs(b.y-yy);
 // Latch only after Coral has entered the OPEN throat, not simply waited
 // just below the closed door. Hold until orb clears the collidable wall.
 if(!g.gateTransit&&g.open>=.96&&insideX&&dist<r*.60)g.gateTransit=true;
 // Keep the safety latch past the *entire* success/clearance threshold;
 // the door must not close one frame before the crossing is counted.
 if(g.gateTransit&&(!insideX||dist>r+wallR()*.52+10))g.gateTransit=false;
}
function succeed(){
 if(g.done||g.missed||!g.unlocked||g.open<.96||!g.crossed)return;
 g.done=true;g.rewardCount++;g.score+=8;
 g.energy=g.energy.map(e=>Math.min(100,e+8));
 $('hint').textContent='УСПЯХТЕ ЗАЕДНО! Синя отвори · Корал премина · ✦ +8 ♡ +8.';
}
function state(){
 return {mode:g.mode,paused:g.paused,time:g.time,realTime:g.realTime,pace:g.pace,
  gain:GAIN,basePace:BASE_PACE,slowPace:SLOW_PACE,puzzleAt:PUZZLE_AT,
  energy:g.energy.slice(),balls:g.balls.map(b=>({...b})),score:g.score,
  key:{x:keyX(),y:gateY(),radius:keyRadius()},chamber:{...chamber(),segments:keySegments()},gate:{x:gateX(),y:gateY(),left:gateLeft(),right:gateRight(),open:g.open},
  unlocked:g.unlocked,keyHeld:g.keyHeld,keyExitTime:g.keyExitTime,gateTransit:g.gateTransit,unlockCount:g.unlockCount,crossed:g.crossed,done:g.done,
  rewardCount:g.rewardCount,missed:g.missed,collisions:g.collisions,
  finished:g.finished,passageStart:g.passageStart,coralMoved:g.coralMoved};
}
function reset(){
 g={mode:'ready',paused:false,time:0,realTime:0,pace:BASE_PACE,
  balls:[{x:W*.19,y:upper()+playH()*.24},{x:W*.56,y:upper()+playH()*.24}],
  energy:[100,100],score:0,unlocked:false,keyHeld:false,keyExitTime:0,gateTransit:false,unlockCount:0,open:0,crossed:false,
  passageStart:false,coralMoved:false,done:false,rewardCount:0,missed:false,collisions:0,finished:false};
 pads.forEach(p=>p.id=null);
 $('finish').style.display='none';$('pause').textContent='Пауза';
 $('hint').textContent='Светът продължава да се движи. Следвай ключа със Синя и премини с Корал.';
 refresh();draw();
}
function refresh(){
 $('e0').textContent='● Синя '+Math.round(g.energy[0]);
 $('e1').textContent='● Корал '+Math.round(g.energy[1]);
 $('score').textContent='✦ '+g.score;
 $('boostClock').textContent='ВРАТА '+Math.round(g.open*100)+'%';
 $('bridgeFill').style.width=Math.round(g.open*100)+'%';
 $('bar').style.width=Math.min(100,100*g.time/TOTAL)+'%';
 $('skip').disabled=g.mode!=='playing'||g.paused||g.done||g.missed||g.gateTransit||g.time<PUZZLE_AT;
 if(g.mode==='ready')$('status').textContent='Сложи двата палеца, за да започне задачата.';
 else if(g.mode==='playing')$('status').textContent=g.paused?'Пауза':
  g.done?'Зелената врата е премината!':
  g.missed?'Вратата е пропусната.':
  g.keyHeld?'Синя държи ключа · ВРАТАТА Е ОТВОРЕНА':
  g.gateTransit?'Корал е в прохода · вратата изчаква':
  g.open>0?'Синя пусна ключа · вратата се затваря':
  g.unlocked?'Вратата затворена · Синя може пак да вземе ключа':
  'Лява: ключ · Дясна: врата · ×'+g.pace.toFixed(1);
}
function resize(){
 const ow=W,oh=H;
 W=Math.max(320,window.innerWidth||800);H=Math.max(390,window.innerHeight||800);
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g&&ow>1&&oh>1){
  for(let n=0;n<2;n++){
   const b=g.balls[n],lr=lane(n);
   b.x=clamp(b.x*W/ow,lr[0],lr[1]);
   b.y=clamp(b.y*H/oh,upper()+radius(),lower()-radius());
  }
  draw();
 }else reset();
}
function move(n,dx,dy){
 if(g.mode==='done'||g.paused||g.missed)return;
 const b=g.balls[n],lr=lane(n),r=radius(),fromY=b.y,oldGateY=gateY();
 if(n===1&&Math.hypot(dx,dy)>1.0)g.coralMoved=true;
 const steps=Math.max(1,Math.min(500,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/Math.max(2,r*.35))));
 for(let k=0;k<steps;k++){
  const x=b.x;b.x=clamp(x+dx/steps,lr[0],lr[1]);
  if((n===1&&solidGate(b.x,b.y))||(n===0&&solidKeyChamber(b.x,b.y))){b.x=x;g.collisions++;}
  const y=b.y;b.y=clamp(y+dy/steps,upper()+r,lower()-r);
  if((n===1&&solidGate(b.x,b.y))||(n===0&&solidKeyChamber(b.x,b.y))){b.y=y;g.collisions++;}
  if(n===0)syncKey();
  if(n===1)syncGateTransit();
  // Mark the below-gate approach even if the closed solid door had kept the
  // passenger just one small step from its contact boundary.
  if(n===1&&g.unlocked&&g.open>=.96&&!g.passageStart&&b.y>oldGateY+r*.6)
   g.passageStart=true;
  // Success only after Coral's whole body has cleared the gate's collision band.
  // Earlier the reward fired while the passenger still touched the threshold.
  if(n===1&&g.passageStart&&g.unlocked&&g.open>=.96&&b.y<oldGateY-(r+wallR()*.52+4)&&b.x>=gateLeft()+r*.7&&b.x<=gateRight()-r*.7){
   g.crossed=true;succeed();
  }
 }
 draw();refresh();
}
for(let n=0;n<2;n++){
 const p=pads[n],el=p.el;
 el.addEventListener('pointerdown',e=>{
  if(p.id!==null)return;e.preventDefault();p.id=e.pointerId;p.x=e.clientX;p.y=e.clientY;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(g.mode==='ready'&&pads.every(v=>v.id!==null))g.mode='playing';
 });
 el.addEventListener('pointermove',e=>{
  if(p.id!==e.pointerId)return;e.preventDefault();
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  move(n,dx*GAIN,dy*GAIN);
 });
 for(const kind of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(kind,e=>{if(e.pointerId!==p.id)return;p.id=null;try{el.releasePointerCapture(e.pointerId)}catch(_){}});
}
$('reset').addEventListener('click',reset);
$('again').addEventListener('click',reset);
$('pause').addEventListener('click',()=>{
 if(g.mode!=='playing')return;g.paused=!g.paused;$('pause').textContent=g.paused?'Продължи':'Пауза';refresh();
});
$('skip').addEventListener('click',()=>{
 if(g.mode!=='playing'||g.paused||g.done||g.missed||g.gateTransit||g.time<PUZZLE_AT)return;
 g.missed=true;$('hint').textContent='Пропусната зелена врата — без обща награда.';
 refresh();
});
function finish(){
 g.mode='done';g.finished=true;
 $('outcome').textContent=g.done?'ОТВОРИХТЕ ВРАТАТА ЗАЕДНО!':g.missed?'Вратата остана затворена':'Опитай пак';
 $('result').textContent='Обща мисия: '+(g.done?'УСПЕХ':g.missed?'ПРОПУСНАТА':'неуспех')+
 ' · ✦ '+g.score+' · енергия '+g.energy.map(e=>Math.round(e)).join(' / ')+
 ' · отключвания '+g.unlockCount+'.';
 $('finish').style.display='flex';
}
function update(dt){
 if(g.mode!=='playing'||g.paused)return;
 g.realTime+=dt;
 // The key and gate are one connected mechanism: continuously powered ONLY
 // while Blue touches the key. Releasing begins closing immediately.
 // Safety latch: once Coral is truly inside the open throat, defer closing
 // until Coral clears the physical doorway (no forced push/teleport).
 syncKey(dt);
 syncGateTransit();
 if(g.keyHeld&&!g.missed)g.open=Math.min(1,g.open+dt/OPEN_SECONDS);
 else if(!g.gateTransit){
  const next=Math.max(0,g.open-dt/CLOSE_SECONDS);
  // Prevent a closing solid wall from appearing inside Coral's actual body.
  const b=g.balls[1],y=gateY(),r=radius(),xInside=b.x>gateLeft()-r*.25&&b.x<gateRight()+r*.25;
  const contactZone=Math.abs(b.y-y)<r+wallR()*.52+2;
  if(next<.96&&g.open>=.96&&xInside&&contactZone)g.open=.961;
  else g.open=next;
 }
 // No pause at the shared task or when the key is held.
 // The object is part of the scrolling world: both thumbs must follow it.
 const oldTime=g.time;
 const delta=Math.max(0,Math.min(BASE_PACE*dt,TOTAL-oldTime));
 const oldGateY=gateY();
 g.time=Math.min(TOTAL,oldTime+delta);
 g.pace=BASE_PACE;
 // Passing a gate in a SCROLLING world: the green opening must sweep
 // upward past Coral. Coral must be actively aligned by the right thumb.
 // This never awards a passive ball parked at the default start x.
 const passenger=g.balls[1],rr=radius(),newGateY=gateY(),
       insideGap=passenger.x>=gateLeft()+rr*.9&&passenger.x<=gateRight()-rr*.9;
 if(g.unlocked&&g.open>=.96&&g.coralMoved&&insideGap&&!g.done){
  const before=oldGateY-passenger.y,after=newGateY-passenger.y;
  if(before>=rr*.55&&before<=rr*4.5)g.passageStart=true;
  if(g.passageStart&&before>=-(rr+wallR()*.52+4)&&after<-(rr+wallR()*.52+4)){
   g.crossed=true;succeed();
  }
 }
 // Solid moving bars push an orb gently rather than freezing time or
 // phasing through it. The push is only a collision response, not inertia.
 const worldMove=gateY()-oldGateY;
 for(let n=0;n<2;n++){
  const b=g.balls[n];
  const collided=()=>n===0?solidKeyChamber(b.x,b.y):solidGate(b.x,b.y);
  if(!collided())continue;
  let k=0;
  while(collided()&&k++<12){
   b.y=clamp(b.y+worldMove,upper()+radius(),lower()-radius());
   if(Math.abs(worldMove)<.001)break;
  }
  if(collided())g.collisions++;
 }
 syncKey(0);syncGateTransit();
 g.energy=g.energy.map(e=>Math.max(0,e-delta*.15));
 if(g.time>=TOTAL)finish();
 refresh();
}
function line(x,y,xx,yy,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function draw(){
 if(!g)return;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#f5f1e8';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#90bca90d';ctx.fillRect(0,0,W*.5,H);
 ctx.fillStyle='#f3a58b0f';ctx.fillRect(W*.5,0,W*.5,H);
 const top=upper(),bottom=lower(),y=gateY(),gl=gateLeft(),gr=gateRight(),r=radius();
 ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='#b9c8bf';ctx.strokeRect(12,top,W-24,bottom-top);ctx.restore();
 line(W*.5,top-14,W*.5,bottom+12,'#cfc6b9',1.5);
 for(let yy=top+(g.time*4)%80-80;yy<bottom;yy+=80){if(yy>=top)line(15,yy,W-15,yy,'#9caea315',1);}
 ctx.save();ctx.beginPath();ctx.rect(0,top,W,bottom-top);ctx.clip();
 // Visual proportions follow #2 on the original pencil sketch:
 // key within a turquoise outlined rectangular niche at LEFT,
