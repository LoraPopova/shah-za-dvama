<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f1e8">
<title>Две половини · Ден 14 — Boost</title>
<style>
:root{--paper:#f5f1e8;--ink:#41534e;--teal:#67a8a3;--coral:#ef9882}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--paper);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:3}
#brand{font-size:10px;font-weight:850;letter-spacing:2px;color:#83978f}
h1{font-size:20px;margin:4px 0;color:#44544f}
#status{font-size:12px;color:#728981;font-weight:700;margin:4px 0}
#stats{display:flex;gap:15px;align-items:center;text-align:right;font-size:13px;font-weight:700}
#stats div{white-space:nowrap}
#score{color:#b88e42}
#boostClock{color:#bf8746;min-width:66px}
#e0{color:#568f89}#e1{color:#d48371}
#progress{position:fixed;left:0;right:0;top:calc(94px + env(safe-area-inset-top,0px));height:4px;background:#d9ddd2;z-index:3}
#bar{height:100%;width:0;background:linear-gradient(90deg,#70aaa2,#e7a48f)}
#menu{position:fixed;top:calc(110px + env(safe-area-inset-top,0px));left:18px;display:flex;gap:8px;z-index:6}
button{border:1px solid #dfdfd5;border-radius:99px;padding:9px 15px;background:#fffffff2;color:#52665e;box-shadow:0 4px 15px #4d5f4a16;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
#hint{position:fixed;top:calc(156px + env(safe-area-inset-top,0px));left:15%;right:15%;text-align:center;pointer-events:none;font-size:14px;font-weight:750;color:#5e8089;z-index:3;text-shadow:0 1px 4px #f5f1e8}
.pad{position:fixed;bottom:calc(clamp(80px,14vh,185px) + env(safe-area-inset-bottom,0px));width:130px;height:130px;border:2px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;z-index:5;box-shadow:inset 0 0 0 10px #ffffff44}
.pad.left{left:calc(25% - 65px);border-color:#84b5ae;background:#85c0b21b}
.pad.right{left:calc(75% - 65px);border-color:#f1b5a4;background:#e8a68a1b}
.knob{height:43px;width:43px;border-radius:50%;pointer-events:none;box-shadow:0 3px 12px #62615733}
.left .knob{background:#7caca6}.right .knob{background:#eda18c}
.pad span{position:absolute;bottom:13px;color:#899890;letter-spacing:.5px;font-size:9px;font-weight:800}
#finish{position:fixed;inset:0;background:#f5f1e8eb;z-index:12;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#finish .inner{max-width:380px;background:white;border-radius:24px;padding:26px 24px;border:1px solid #e7e5dd;box-shadow:0 18px 45px #45544d24}
#finish h2{font-size:25px;margin:0 0 12px}#finish p{font-size:15px;line-height:1.4}#finish button{background:#4f8d84;color:white;border:0;font-size:15px;padding:13px 24px}
@media(max-width:680px){
header{left:12px;right:12px}h1{font-size:16px}
#stats{font-size:10px;gap:6px;align-items:start}
#status{font-size:10px;max-width:210px}
#menu{left:12px}#hint{font-size:12px;left:6%;right:6%}
.pad{width:105px;height:105px}.pad.left{left:calc(25% - 52px)}.pad.right{left:calc(75% - 52px)}
}
@media(max-height:580px){.pad{bottom:calc(40px + env(safe-area-inset-bottom,0px))}#progress{top:85px}#menu{top:97px}#hint{top:145px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<header>
<div><div id="brand">TWO HALVES · СКИЦА №7</div><h1>Ден 14 · Boost</h1><div id="status">Оранжевият бонус ускорява целия свят — и за двамата.</div></div>
<div id="stats"><div id="e0">● Синя 100</div><div id="e1">● Корал 100</div><div id="score">✦ 0</div><div id="boostClock">×5</div></div>
</header>
<div id="progress"><div id="bar"></div></div>
<div id="menu"><button id="reset">Отначало</button><button id="pause">Пауза</button><button id="power">Boost ×10</button></div>
<div id="hint">Вземи оранжевия Boost с ЕДНАТА светлина — ускорява И ДВЕТЕ.</div>
<div class="pad left" id="pad0"><div class="knob" id="knob0"></div><span>ЛЯВ ПАЛЕЦ</span></div>
<div class="pad right" id="pad1"><div class="knob" id="knob1"></div><span>ДЕСЕН ПАЛЕЦ</span></div>
<div id="finish"><div class="inner"><h2 id="outcome">Край на деня</h2><p id="result"></p><button id="again">Играй отново</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),C=['#67a8a3','#ef9882'];
const GAIN=2.5,BASE_PACE=5,DURATION=126,BOOST_AT=32,BOOST_SECONDS=2.7;
let W=1,H=1,dpr=1,g=null,prevFrame=0,selectedPower=10;
const pads=[{id:null,x:0,y:0,el:$('pad0')},{id:null,x:0,y:0,el:$('pad1')}];
const coins=[
 {t:10,n:0,x:.27,value:1},{t:10,n:1,x:.73,value:1},
 {t:20,n:0,x:.33,value:1},{t:20,n:1,x:.67,value:1},
 {t:39,n:0,x:.31,value:1},{t:39,n:1,x:.69,value:1},
 {t:44,n:0,x:.43,value:3},{t:44,n:1,x:.57,value:3},
 {t:49,n:0,x:.26,value:1},{t:49,n:1,x:.74,value:1},
 {t:54,n:0,x:.36,value:1},{t:54,n:1,x:.64,value:1},
 {t:59,n:0,x:.43,value:3},{t:59,n:1,x:.57,value:3},
 {t:65,n:0,x:.27,value:1},{t:65,n:1,x:.73,value:1},
 {t:72,n:0,x:.39,value:1},{t:72,n:1,x:.61,value:1},
 {t:81,n:0,x:.25,value:3},{t:81,n:1,x:.75,value:3},
 {t:93,n:0,x:.34,value:1},{t:93,n:1,x:.66,value:1},
 {t:108,n:0,x:.27,value:1},{t:108,n:1,x:.73,value:1}
];
const radius=()=>clamp(Math.min(W,H)*.019,11,19);
const upper=()=>Math.max(110,H*.16);
const lower=()=>Math.max(upper()+80,Math.min(H*.68,H-145));
const stageY=t=>H*.36+(t-g.time)*7;
const orbX=n=>(n===0?.39:.61)*W;
const currentPace=()=>g.boostLeft>0?selectedPower:BASE_PACE;
const lane=n=>n===0?[radius(),W*.5-radius()]:[W*.5+radius(),W-radius()];
function state(){
 return {mode:g.mode,paused:g.paused,time:g.time,realTime:g.realTime,energy:g.energy.slice(),
  balls:g.balls.map(b=>({...b})),score:g.score,earned:coins.map(c=>!!c.used),
  boosterUsed:g.boosterUsed,boosterMissed:g.boosterMissed,boostActivations:g.boostActivations,
  boostLeft:g.boostLeft,boostElapsed:g.boostElapsed,boostTriggeredBy:g.triggeredBy,
  selectedPower,currentPace:currentPace(),basePace:BASE_PACE,gain:GAIN,
  initialBoostTime:BOOST_AT,boostDuration:BOOST_SECONDS,
  coinPositions:coins.map(c=>({t:c.t,n:c.n,x:c.x,value:c.value,used:!!c.used})),finished:g.finished};
}
function reset(){
 g={mode:'ready',paused:false,time:0,realTime:0,energy:[100,100],
    score:0,balls:[{x:W*.26,y:H*.35},{x:W*.74,y:H*.35}],
    boosterUsed:false,boosterMissed:false,boostActivations:0,boostLeft:0,
    boostElapsed:0,triggeredBy:null,finished:false,boostEndAt:-1};
 coins.forEach(c=>c.used=false);
 for(const p of pads)p.id=null;
 $('pause').textContent='Пауза';$('finish').style.display='none';
 $('status').textContent='Вземи оранжевия бонус за кратка по-бърза смяна.';
 $('hint').textContent='Един от двата оранжеви знака включва ускорение за ДВАМАТА.';
 $('power').textContent='Boost ×'+selectedPower;
 $('power').disabled=false;
 refresh();draw();
}
function refresh(){
 $('e0').textContent='● Синя '+Math.round(g.energy[0]);
 $('e1').textContent='● Корал '+Math.round(g.energy[1]);
 $('score').textContent='✦ '+g.score;
 $('boostClock').textContent=g.boostLeft>0?
  '×'+selectedPower+' · '+g.boostLeft.toFixed(1)+'s':'×5';
 $('bar').style.width=(100*g.time/DURATION)+'%';
 if(g.mode==='ready')$('status').textContent='Постави двата палеца, за да започне тестът.';
 else if(g.mode==='playing'&&!g.paused){
  $('status').textContent=g.boostLeft>0?
   'BOOST! Светът е ×'+selectedPower+' · палците продължават 2,50×':
   'Нормален скрол ×5 · следвай монетите ✦';
 }
}
function resize(){
 const oldW=W,oldH=H;
 W=Math.max(320,window.innerWidth||800);H=Math.max(390,window.innerHeight||800);
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g&&oldW>1&&oldH>1){
  for(let n=0;n<2;n++){
   const b=g.balls[n],lr=lane(n);
   b.x=clamp(b.x*W/oldW,lr[0],lr[1]);
   b.y=clamp(b.y*H/oldH,upper()+radius(),lower()-radius());
  }
  draw();
 }else reset();
}
function move(n,dx,dy){
 if(!g||g.mode==='done'||g.paused)return;
 const b=g.balls[n],lr=lane(n);
 b.x=clamp(b.x+dx*GAIN,lr[0],lr[1]);
 b.y=clamp(b.y+dy*GAIN,upper()+radius(),lower()-radius());
 // Thumb displacement is direct. Boost NEVER affects this function.
}
for(let n=0;n<2;n++){
 const p=pads[n],el=p.el;
 el.addEventListener('pointerdown',e=>{
  if(p.id!==null)return;
  e.preventDefault();p.id=e.pointerId;p.x=e.clientX;p.y=e.clientY;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(g.mode==='ready'&&pads.every(x=>x.id!==null)){
   g.mode='playing';
   $('power').disabled=true;
   $('hint').textContent='Приближи се до оранжевия Boost — после хващай парите!';
  }
 });
 el.addEventListener('pointermove',e=>{
  if(p.id!==e.pointerId)return;
  e.preventDefault();const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  move(n,dx,dy);draw();
 });
 for(const k of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(k,e=>{
  if(e.pointerId!==p.id)return;
  p.id=null;try{el.releasePointerCapture(e.pointerId)}catch(_){}
 });
}
$('reset').addEventListener('click',reset);
$('again').addEventListener('click',reset);
$('pause').addEventListener('click',()=>{
 if(g.mode!=='playing')return;g.paused=!g.paused;
 $('pause').textContent=g.paused?'Продължи':'Пауза';
 $('status').textContent=g.paused?'На пауза':'Продължаваме!';
 refresh();
});
$('power').addEventListener('click',()=>{
 if(g.mode!=='ready')return;
 selectedPower=selectedPower===10?8:10;
 $('power').textContent='Boost ×'+selectedPower;
});
function activate(n){
 if(g.boosterUsed||g.boosterMissed||g.mode!=='playing')return;
 g.boosterUsed=true;g.boostActivations++;g.triggeredBy=n;g.boostLeft=BOOST_SECONDS;g.boostElapsed=0;
 $('hint').textContent='ТУРБО ×'+selectedPower+'! ДВЕТЕ светлини бързат към следващата заплата ✦';
}
function checkBooster(){
 if(g.boosterUsed||g.boosterMissed)return;
 const y=stageY(BOOST_AT);
 for(let n=0;n<2;n++){
  const b=g.balls[n];
  if(Math.hypot(b.x-orbX(n),b.y-y)<radius()+27){activate(n);return;}
 }
 if(y<upper()-48){
  g.boosterMissed=true;
  $('hint').textContent='Boost пропуснат — можеш да събереш монетите и без него.';
 }
}
function update(dt){
 if(!g||g.mode!=='playing'||g.paused)return;
 g.realTime+=dt;
 const boosted=g.boostLeft>0,pace=boosted?selectedPower:BASE_PACE;
 g.time=Math.min(DURATION,g.time+dt*pace);
 if(boosted){
  g.boostElapsed+=Math.min(dt,g.boostLeft);
  g.boostLeft=Math.max(0,g.boostLeft-dt);
  if(g.boostLeft===0&&g.boosterUsed){
   g.boostEndAt=g.realTime;
   $('hint').textContent='Boost приключи · връщаме нормалния скрол ×5';
  }
 }
 checkBooster();
 for(const c of coins){
  if(c.used)continue;
  const b=g.balls[c.n],y=stageY(c.t);
  if(Math.hypot(b.x-c.x*W,b.y-y)<radius()+12){
   c.used=true;g.score+=c.value;
  }
 }
 if(g.time>=DURATION){
  g.mode='done';g.finished=true;
  $('outcome').textContent=g.boosterUsed?'Турбо смяната приключи!':'Денят мина без Boost';
  $('result').textContent='Доход ✦ '+g.score+
    ' · Boost: '+(g.boosterUsed?'×'+selectedPower+' за '+g.boostElapsed.toFixed(1)+' s':'пропуснат')+
    ' · Опитай и другата мощност за сравнение.';
  $('finish').style.display='flex';
 }
 refresh();
}
function line(x1,y1,x2,y2,col,width=2){
 ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();
 ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function disk(x,y,r,fill){
 ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function draw(){
 if(!g)return;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#f5f1e8';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#92beb20c';ctx.fillRect(0,0,W*.5,H);
 ctx.fillStyle='#efad930a';ctx.fillRect(W*.5,0,W*.5,H);
 const top=upper(),bottom=lower();
 ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='#bfc4b9';ctx.lineWidth=1;
 ctx.strokeRect(11,top,W-22,bottom-top);
 ctx.restore();
 line(W*.5,top-15,W*.5,bottom+15,'#c7c0ba',1.5);
 // Light horizontal world lines give an unambiguous sense of speed.
 let shift=(g.time*7)%62;
 for(let y=top+shift-62;y<=bottom+62;y+=62){
  if(y<top||y>bottom)continue;
  line(20,y,W-20,y,g.boostLeft>0?'#e0ac684b':'#b8c3b526',g.boostLeft>0?2:1);
 }
 // A spacious, hazard-free boost zone. All coin trails are world-anchored.
 const start=stageY(BOOST_AT+6),end=stageY(BOOST_AT+60);
 const a=Math.max(top,Math.min(start,end)),b=Math.min(bottom,Math.max(start,end));
 if(b>a){
  ctx.fillStyle=g.boostLeft>0?'#f4dfb43d':'#ecdcb522';
  ctx.fillRect(10,a,W-20,b-a);
 }
 if(!g.boosterUsed&&!g.boosterMissed){
  const y=stageY(BOOST_AT);
  if(y>=top-40&&y<=bottom+55){
   ctx.save();ctx.setLineDash([7,8]);
   line(orbX(0),y,orbX(1),y,'#d8a354',3);ctx.restore();
   for(let n=0;n<2;n++){
    const x=orbX(n);
    disk(x,y,30,'#e9bd6980');disk(x,y,21,'#e3ab50');
    ctx.fillStyle='#fffdf5';ctx.textAlign='center';
    ctx.font='bold 15px sans-serif';ctx.fillText('×'+selectedPower,x,y+5);
   }
   ctx.fillStyle='#a47e47';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
   ctx.fillText('BOOST ЗА ДВАМАТА',W*.5,y-43);
  }
 }
 if(g.boostLeft>0){
  ctx.fillStyle='#d7a155';ctx.textAlign='center';ctx.font='bold 19px sans-serif';
  ctx.fillText('BOOST ×'+selectedPower+' · '+g.boostLeft.toFixed(1)+' s',W*.5,top+38);
  for(let n=0;n<2;n++){
   const x=n===0?W*.25:W*.75;
   for(let k=0;k<3;k++){
    const xx=x+(k-1)*24,from=top+70+((g.realTime*120+k*89)%Math.max(100,bottom-top-100));
    line(xx,from,xx,Math.min(bottom,from+36),'#cba36648',3);
   }
  }
 }
 for(const c of coins){
  if(c.used)continue;
  const y=stageY(c.t),x=c.x*W;
  if(y<top-35||y>bottom+35)continue;
  disk(x,y,c.value===3?17:12,'#e6bc6975');
  disk(x,y,c.value===3?9:6,'#dcb05b');
  if(c.value===3){ctx.fillStyle='#fffdf7';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('✦',x,y+4);}
 }
 for(let n=0;n<2;n++){
  const b=g.balls[n],r=radius(),gr=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,r*2.4);
  gr.addColorStop(0,C[n]+'66');gr.addColorStop(1,C[n]+'00');
  disk(b.x,b.y,r*2.4,gr);
  disk(b.x,b.y,r,C[n]);disk(b.x-r*.23,b.y-r*.25,r*.18,'#fff9');
 }
 if(g.mode==='ready'){
  ctx.fillStyle='#6a8c86';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
  ctx.fillText('ДВА ПАЛЕЦА = СТАРТ',W*.5,bottom+33);
 }
}
function frame(ts){
 if(!prevFrame)prevFrame=ts;
 const dt=Math.max(0,Math.min(.05,(ts-prevFrame)/1000));prevFrame=ts;
 if(g)update(dt);
 if(g)draw();
 requestAnimationFrame(frame);
}
window.__twoHalvesQA={state,advance:update,reset,move,stageY,activate,resize,choosePower:v=>{
 if(g.mode!=='ready'||![8,10].includes(v))return false;
 selectedPower=v;$('power').textContent='Boost ×'+v;return true;
}};
window.addEventListener('resize',resize,{passive:true});
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
