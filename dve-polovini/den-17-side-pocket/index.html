<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f1e8">
<title>Две половини · Ден 17 — Страничен джоб v1</title>
<style>
:root{--paper:#f5f1e8;--ink:#41534e;--teal:#67a8a3;--coral:#ef9882}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--paper);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:3}
#brand{font-size:10px;font-weight:850;letter-spacing:2px;color:#83978f}
h1{font-size:20px;margin:4px 0;color:#44544f}
#status{font-size:12px;color:#728981;font-weight:700;margin:4px 0}
#stats{display:flex;gap:15px;align-items:center;text-align:right;font-size:13px;font-weight:700}
#stats div{white-space:nowrap}
#score{color:#b88e42}
#boostClock{color:#bf8746;min-width:66px}
#e0{color:#568f89}#e1{color:#d48371}
#progress{position:fixed;left:0;right:0;top:calc(94px + env(safe-area-inset-top,0px));height:4px;background:#d9ddd2;z-index:3}
#bar{height:100%;width:0;background:linear-gradient(90deg,#70aaa2,#e7a48f)}
#menu{position:fixed;top:calc(110px + env(safe-area-inset-top,0px));left:18px;display:flex;gap:8px;z-index:6}
button{border:1px solid #dfdfd5;border-radius:99px;padding:9px 15px;background:#fffffff2;color:#52665e;box-shadow:0 4px 15px #4d5f4a16;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
#hint{position:fixed;top:calc(156px + env(safe-area-inset-top,0px));left:15%;right:15%;text-align:center;pointer-events:none;font-size:14px;font-weight:750;color:#5e8089;z-index:3;text-shadow:0 1px 4px #f5f1e8}
.pad{position:fixed;bottom:calc(clamp(80px,14vh,185px) + env(safe-area-inset-bottom,0px));width:130px;height:130px;border:2px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;z-index:5;box-shadow:inset 0 0 0 10px #ffffff44}
.pad.left{left:calc(25% - 65px);border-color:#84b5ae;background:#85c0b21b}
.pad.right{left:calc(75% - 65px);border-color:#f1b5a4;background:#e8a68a1b}
.knob{height:43px;width:43px;border-radius:50%;pointer-events:none;box-shadow:0 3px 12px #62615733}
.left .knob{background:#7caca6}.right .knob{background:#eda18c}
.pad span{position:absolute;bottom:13px;color:#899890;letter-spacing:.5px;font-size:9px;font-weight:800}
#finish{position:fixed;inset:0;background:#f5f1e8eb;z-index:12;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#finish .inner{max-width:380px;background:white;border-radius:24px;padding:26px 24px;border:1px solid #e7e5dd;box-shadow:0 18px 45px #45544d24}
#finish h2{font-size:25px;margin:0 0 12px}#finish p{font-size:15px;line-height:1.4}#finish button{background:#4f8d84;color:white;border:0;font-size:15px;padding:13px 24px}
@media(max-width:680px){
header{left:12px;right:12px}h1{font-size:16px}
#stats{font-size:10px;gap:6px;align-items:start}
#status{font-size:10px;max-width:210px}
#menu{left:12px}#hint{font-size:12px;left:6%;right:6%}
.pad{width:105px;height:105px}.pad.left{left:calc(25% - 52px)}.pad.right{left:calc(75% - 52px)}
}
@media(max-height:580px){.pad{bottom:calc(40px + env(safe-area-inset-bottom,0px))}#progress{top:85px}#menu{top:97px}#hint{top:145px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<header>
<div><div id="brand">TWO HALVES · СКИЦА №4</div><h1>Ден 17 · Страничен джоб</h1><div id="status">Корал: влез за точки и излез навреме. Синя: следвай безопасните точки.</div></div>
<div id="stats"><div id="e0">● Синя 100</div><div id="e1">● Корал 100</div><div id="score">✦ 0</div><div id="boostClock">×5</div></div>
</header>
<div id="progress"><div id="bar"></div></div>
<div id="menu"><button id="reset">Отначало</button><button id="pause">Пауза</button></div>
<div id="hint">Корал: рисковият U-джоб носи повече точки. Излез през лявата му страна.</div>
<div class="pad left" id="pad0"><div class="knob" id="knob0"></div><span>ЛЯВ ПАЛЕЦ</span></div>
<div class="pad right" id="pad1"><div class="knob" id="knob1"></div><span>ДЕСЕН ПАЛЕЦ</span></div>
<div id="finish"><div class="inner"><h2 id="outcome">Край на деня</h2><p id="result"></p><button id="again">Играй отново</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const C=['#67a8a3','#ef9882'],GAIN=2.5,PACE=5,DURATION=74,COIN_R=8,SCROLL_RATE=.016,EVENT_TIME=16;
let W=1,H=1,dpr=1,g=null,prevFrame=0;
const pads=[{id:null,x:0,y:0,el:$('pad0')},{id:null,x:0,y:0,el:$('pad1')}];
const rad=()=>clamp(Math.min(W,H)*.019,11,19);
const upper=()=>Math.max(110,H*.16);
const lower=()=>Math.max(upper()+90,Math.min(H*.69,H-145));
const playH=()=>lower()-upper();
const lane=n=>n===0?[rad(),W*.5-rad()]:[W*.5+rad(),W-rad()];
const thickness=()=>clamp(Math.min(W,H)*.010,5,9);
const chamber=()=>({x0:W*.60,x1:W*.88,half:clamp(playH()*.16,33,62),cy:upper()+playH()*(.86+(EVENT_TIME-g.time)*SCROLL_RATE)});
function segments(){
 const p=chamber(),t=thickness();
 return [[p.x0,p.cy-p.half,p.x1,p.cy-p.half,t],
         [p.x0,p.cy+p.half,p.x1,p.cy+p.half,t],
         [p.x1,p.cy-p.half,p.x1,p.cy+p.half,t]];
}
function segDistSq(x,y,x0,y0,x1,y1){
 const dx=x1-x0,dy=y1-y0,len=dx*dx+dy*dy;
 const k=len?clamp(((x-x0)*dx+(y-y0)*dy)/len,0,1):0;
 return (x-x0-dx*k)**2+(y-y0-dy*k)**2;
}
function blocked(x,y){
 const r=rad()+thickness()*.5-.25;
 return segments().some(([a,b,c,d])=>segDistSq(x,y,a,b,c,d)<r*r);
}
const items=[
 {id:'safe0',side:0,xf:.32,yf:-.72,value:1},
 {id:'safe1',side:0,xf:.41,yf:.07,value:1},
 {id:'safe2',side:0,xf:.36,yf:.70,value:1},
 {id:'safeR',side:1,xf:.65,yf:-1.80,value:1},
 {id:'pocket0',side:1,xf:.32,yf:-.38,value:1,pocket:true},
 {id:'pocket1',side:1,xf:.56,yf:.38,value:1,pocket:true},
 {id:'pocketGold',side:1,xf:.77,yf:0,value:3,pocket:true}
];
function coinPos(c){
 const p=chamber();
 return {x:c.pocket?p.x0+(p.x1-p.x0)*c.xf:W*c.xf,y:p.cy+p.half*c.yf};
}
function reset(){
 g={mode:'ready',paused:false,time:0,realTime:0,pace:PACE,
 balls:[{x:W*.25,y:upper()+playH()*.24},{x:W*.56,y:upper()+playH()*.24}],
 energy:[100,100],score:0,taken:[],entered:false,pocketTaken:0,escaped:false,
 hits:0,lastHit:[-99,-99],finished:false};
 pads.forEach(p=>p.id=null);
 $('finish').style.display='none';$('pause').textContent='Пауза';
 $('hint').textContent='Синя: безопасни точки. Корал: влез в U-джоба, събери и излез.';
 refresh();draw();
}
function state(){
 return {mode:g.mode,paused:g.paused,time:g.time,realTime:g.realTime,pace:g.pace,gain:GAIN,
  balls:g.balls.map(b=>({...b})),energy:g.energy.slice(),score:g.score,taken:g.taken.slice(),
  entered:g.entered,pocketTaken:g.pocketTaken,escaped:g.escaped,hits:g.hits,finished:g.finished,
  chamber:chamber(),segments:segments(),items:items.map(c=>({...c,...coinPos(c),taken:g.taken.includes(c.id)}))};
}
function resize(){
 const ow=W,oh=H;
 W=Math.max(320,window.innerWidth||800);H=Math.max(390,window.innerHeight||800);
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g&&ow>1&&oh>1){
  g.balls.forEach((b,n)=>{const l=lane(n);b.x=clamp(b.x*W/ow,l[0],l[1]);b.y=clamp(b.y*H/oh,upper()+rad(),lower()-rad());});
  draw();refresh();
 }else reset();
}
function refresh(){
 $('e0').textContent='● Синя '+Math.round(g.energy[0]);
 $('e1').textContent='● Корал '+Math.round(g.energy[1]);
 $('score').textContent='✦ '+g.score;
 $('boostClock').textContent='×'+g.pace;
 $('bar').style.width=Math.min(100,g.time/DURATION*100)+'%';
 if(g.mode==='ready')$('status').textContent='Двата палеца стартират. U-джобът се движи със света.';
 else if(g.paused)$('status').textContent='Пауза';
 else if(g.mode==='done')$('status').textContent='Край на участъка';
 else $('status').textContent=g.escaped?'Джобът е напуснат · ✦2 за излизането':'Точките в джоба са рискови · скрол ×5';
}
function hit(n){
 if(g.realTime-g.lastHit[n]<.85)return;
 g.lastHit[n]=g.realTime;g.hits++;g.energy[n]=Math.max(0,g.energy[n]-5);
}
function checkPocket(){
 const p=chamber(),b=g.balls[1],r=rad();
 // A genuine entry occurs only when the orb centre is inside the open U.
 const inside=b.x>=p.x0+r*.1&&b.x<=p.x1-r*.6&&Math.abs(b.y-p.cy)<p.half-r*.6;
 if(inside)g.entered=true;
 // Escape reward requires entering, taking pocket income, then crossing back
 // out of the U mouth while still near the open corridor. One time only.
 if(g.entered&&!g.escaped&&g.pocketTaken>0&&b.x<p.x0-r*.5&&Math.abs(b.y-p.cy)<p.half-r*.45){
  g.escaped=true;g.score+=2;
  $('hint').textContent='Измъкна се навреме! ✦2 бонус за излизане.';
 }
}
function collect(n){
 const b=g.balls[n],r=rad();
 for(const c of items){
  if(c.side!==n||g.taken.includes(c.id))continue;
  const p=coinPos(c),lim=r+COIN_R+2;
  if((b.x-p.x)**2+(b.y-p.y)**2>lim*lim)continue;
  g.taken.push(c.id);g.score+=c.value;
  if(c.pocket)g.pocketTaken++;
  if(c.value===3)$('hint').textContent='Златната искра! ✦3 · намери изхода от джоба.';
 }
 if(n===1)checkPocket();
}
function move(n,dx,dy){
 if(g.mode!=='playing'||g.paused)return;
 const b=g.balls[n],l=lane(n),r=rad();
 const steps=Math.max(1,Math.min(500,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/Math.max(2,r*.32))));
 for(let i=0;i<steps;i++){
  const ox=b.x;b.x=clamp(ox+dx/steps,l[0],l[1]);
  if(n===1&&blocked(b.x,b.y)){b.x=ox;hit(n);}
  const oy=b.y;b.y=clamp(oy+dy/steps,upper()+r,lower()-r);
  if(n===1&&blocked(b.x,b.y)){b.y=oy;hit(n);}
  collect(n);
 }
 refresh();draw();
}
for(let n=0;n<2;n++){
 const p=pads[n],el=p.el;
 el.addEventListener('pointerdown',e=>{
  if(p.id!==null)return;e.preventDefault();p.id=e.pointerId;p.x=e.clientX;p.y=e.clientY;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(g.mode==='ready'&&pads.every(v=>v.id!==null))g.mode='playing';
 });
 el.addEventListener('pointermove',e=>{
  if(e.pointerId!==p.id)return;e.preventDefault();
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  move(n,dx*GAIN,dy*GAIN);
 });
 for(const kind of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(kind,e=>{if(e.pointerId!==p.id)return;p.id=null;try{el.releasePointerCapture(e.pointerId)}catch(_){}});
}
$('reset').addEventListener('click',reset);
$('again').addEventListener('click',reset);
$('pause').addEventListener('click',()=>{
 if(g.mode!=='playing')return;g.paused=!g.paused;
 $('pause').textContent=g.paused?'Продължи':'Пауза';refresh();
});
function finish(){
 if(g.finished)return;g.finished=true;g.mode='done';
 $('outcome').textContent=g.escaped?'УСПЕШНО ОТКЛОНЕНИЕ!':'КРАЙ НА УЧАСТЪКА';
 $('result').textContent='Събрани ✦'+g.score+' от възможни 11 · Джоб '+g.pocketTaken+'/3 точки · Излизане '+(g.escaped?'да':'не')+' · Енергия '+g.energy.map(x=>Math.round(x)).join(' / ')+'.';
 $('finish').style.display='flex';
}
function update(dt){
 if(g.mode!=='playing'||g.paused)return;
 const oldY=chamber().cy;
 g.realTime+=dt;g.time=Math.min(DURATION,g.time+dt*PACE);g.pace=PACE;
 // Scroll the solid U with the world. It must not freeze when the orb touches.
 // Resolve moving-wall overlap by following its small frame displacement;
 // never teleport across the wall or move the player's thumb control itself.
 const drift=chamber().cy-oldY,b=g.balls[1];
 if(blocked(b.x,b.y)){
  let tries=0;
  while(blocked(b.x,b.y)&&tries++<15){
   b.y=clamp(b.y+drift,upper()+rad(),lower()-rad());
   if(Math.abs(drift)<.0001)break;
  }
  if(blocked(b.x,b.y))hit(1);
 }
 for(let n=0;n<2;n++)collect(n);
 if(g.time>=DURATION)finish();
 refresh();
}
function line(x,y,xx,yy,color,width=2){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill();
}
function draw(){
 if(!g)return;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#f5f1e8';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#90bca90d';ctx.fillRect(0,0,W*.5,H);
 ctx.fillStyle='#f3a58b0f';ctx.fillRect(W*.5,0,W*.5,H);
 const top=upper(),bottom=lower(),p=chamber(),r=rad();
 ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='#b9c8bf';ctx.strokeRect(12,top,W-24,bottom-top);ctx.restore();
 line(W*.5,top-14,W*.5,bottom+12,'#cfc6b9',1.5);
 for(let y=top+(g.time*3)%70-70;y<bottom;y+=70)if(y>=top)line(15,y,W-15,y,'#9caea31a',1);
 ctx.save();ctx.beginPath();ctx.rect(0,top,W,bottom-top);ctx.clip();
 // The open mouth of the U is visibly on its LEFT, toward Coral's starting route.
 ctx.fillStyle='#e9c7aa28';ctx.fillRect(p.x0,p.cy-p.half,p.x1-p.x0,p.half*2);
 for(const [x0,y0,x1,y1,w] of segments()){
  line(x0,y0,x1,y1,'#986b65',w+3);
  line(x0,y0,x1,y1,'#bf8a7c',w);
 }
 ctx.fillStyle='#ad7d6377';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
 ctx.fillText('✦ ВЛЕЗ И ИЗЛЕЗ',p.x0+(p.x1-p.x0)*.48,p.cy-p.half-14);
 for(const c of items){
  if(g.taken.includes(c.id))continue;
  const at=coinPos(c);
  circle(at.x,at.y,c.value===3?COIN_R+9:COIN_R+5,'#f4c65a30');
  circle(at.x,at.y,c.value===3?COIN_R+3:COIN_R,c.value===3?'#e3ae47':'#eac96e');
  circle(at.x-2,at.y-2,2,'#fff7d7');
 }
 ctx.restore();
 for(let n=0;n<2;n++){
  const b=g.balls[n],gl=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*2.5);
  gl.addColorStop(0,C[n]+'70');gl.addColorStop(1,C[n]+'00');
  circle(b.x,b.y,r*2.5,gl);circle(b.x,b.y,r,C[n]);
  circle(b.x-r*.24,b.y-r*.25,r*.17,'#ffffffb5');
 }
 if(g.mode==='ready'){
  ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillStyle='#69877a';
  ctx.fillText('ДВА ПАЛЕЦА = СТАРТ',W*.5,bottom+30);
 }
}
function frame(ts){
 if(!prevFrame)prevFrame=ts;
 const dt=Math.max(0,Math.min(.05,(ts-prevFrame)/1000));prevFrame=ts;
 if(g)update(dt);if(g)draw();requestAnimationFrame(frame);
}
window.__twoHalvesQA={state,advance:update,reset,move,collect,coinPos,blocked,segments,chamber,checkPocket,resize};
window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
