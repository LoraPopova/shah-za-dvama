<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f0">
<title>Две половини · След бурята</title>
<style>
:root{color-scheme:light;--ink:#405651;--teal:#69aaa7;--coral:#ed997b;--gold:#e5b35f;--paper:#fdf9f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;touch-action:none;color:var(--ink)}
#scene{position:absolute;width:100%;height:100%;inset:0;display:block;touch-action:none}
.top{position:absolute;z-index:8;top:calc(7px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.name{font-weight:850;font-size:clamp(16px,2.8vw,23px);letter-spacing:-.045em;line-height:1.05}.sub{font-size:10px;font-weight:700;opacity:.6;margin-top:3px}
.actions{display:flex;gap:6px;pointer-events:auto}.actions button{border:1px solid #d8e1d5;background:#fffcf4df;color:#47615b;border-radius:50px;padding:8px 11px;font-weight:800;font-size:12px;min-height:35px}
#stage{position:absolute;z-index:4;left:50%;transform:translateX(-50%);top:calc(55px + env(safe-area-inset-top));border:1px solid #e1e7da;border-radius:50px;padding:6px 12px;font-size:12px;font-weight:850;white-space:nowrap;background:#fffcf1dc;pointer-events:none}
#status{position:absolute;z-index:4;top:calc(87px + env(safe-area-inset-top));left:9%;right:9%;text-align:center;font-size:clamp(12px,1.85vw,17px);font-weight:750;line-height:1.35;color:#5d7b72;pointer-events:none;text-shadow:0 1px #fff}
.energy{position:absolute;z-index:4;top:calc(132px + env(safe-area-inset-top));width:min(27vw,175px);pointer-events:none;display:flex;align-items:center;gap:7px}.energy.left{left:clamp(14px,7vw,100px)}.energy.right{right:clamp(14px,7vw,100px)}
.dot{height:13px;width:13px;border-radius:50%;flex:none}.energy .meter{flex:1;height:10px;border-radius:20px;background:#e7e5db;overflow:hidden;box-shadow:inset 0 1px 1px #29473a13}.energy .fill{height:100%;width:80%;border-radius:20px;transition:width .2s linear}.energy .pct{font-weight:850;min-width:30px;font-size:12px}
#progress{position:absolute;z-index:4;top:calc(158px + env(safe-area-inset-top));left:10%;right:10%;text-align:center;font-size:12px;font-weight:800;color:#79847a;pointer-events:none}
#feedback{position:absolute;z-index:4;left:50%;bottom:calc(185px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;white-space:nowrap;pointer-events:none;color:#846f6c;font-weight:800;min-height:18px}
.zone{position:absolute;z-index:6;bottom:0;height:37%;width:44%;touch-action:none;overscroll-behavior:contain;cursor:crosshair}
#left-zone{left:0}#right-zone{right:0}
.pad{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:clamp(100px,13vw,150px);height:clamp(100px,13vw,150px);border:2px solid #fff9;border-radius:50%;pointer-events:none;box-shadow:0 4px 16px #5472681a,inset 0 0 0 1px #ffffff60}
#left-pad{background:#cde6dfa6}#right-pad{background:#fae3d7ae}
.pad:before,.pad:after{content:"";position:absolute;background:#58786b29}.pad:before{height:75%;top:12.5%;width:1px;left:50%}.pad:after{width:75%;left:12.5%;height:1px;top:50%}
.knob{position:absolute;top:50%;left:50%;width:45%;height:45%;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform;box-shadow:0 2px 8px #304d4c28}
#left-knob{background:#69aaa7}#right-knob{background:#ed997b}
.zone .hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;font-weight:850;white-space:nowrap;letter-spacing:.05em;left:50%;transform:translateX(-50%);pointer-events:none;opacity:.85}
#left-zone .hint{color:#598e8b}#right-zone .hint{color:#d38770}
#finish{display:none;position:absolute;z-index:12;inset:0;background:#fffaf2de;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px;flex-direction:column;text-align:center;gap:12px}
#finish.show{display:flex}#finish .flower{font-size:65px}#finish h2{font-size:clamp(25px,4vw,40px);letter-spacing:-.04em;margin:0}#finish p{line-height:1.45;margin:0;max-width:370px}#again{border:0;border-radius:50px;background:#405e54;color:#fff;font-size:16px;font-weight:850;padding:13px 25px;margin-top:7px}
@media(max-height:650px){#status{top:calc(71px + env(safe-area-inset-top));font-size:12px}.energy{top:calc(104px + env(safe-area-inset-top))}#progress{top:calc(125px + env(safe-area-inset-top))}.zone{height:42%}.pad{width:clamp(92px,11vw,122px);height:clamp(92px,11vw,122px)}#feedback{bottom:145px}}
@media(max-width:580px){.name{font-size:15px}.sub{font-size:9px}.actions button{padding:6px 9px;font-size:11px;min-height:31px}#stage{top:calc(47px + env(safe-area-inset-top));font-size:11px}#status{top:calc(76px + env(safe-area-inset-top));left:5%;right:5%}.energy{top:calc(125px + env(safe-area-inset-top));width:33vw}.energy.left{left:10px}.energy.right{right:10px}.energy .pct{font-size:10px;min-width:25px}#progress{top:calc(149px + env(safe-area-inset-top));font-size:11px}.pad{width:100px;height:100px}#feedback{bottom:calc(155px + env(safe-area-inset-bottom));font-size:11px}.zone{height:33%}}
</style>
</head>
<body>
<div id="app">
 <canvas id="scene" aria-label="Игра Две половини: След бурята"></canvas>
 <div class="top"><div><div class="name">Две половини</div><div class="sub">СЛЕД БУРЯТА · ПРОТОТИП</div></div><div class="actions"><button id="instructions" type="button">? Помощ</button><button id="restart" type="button">↻ Отначало</button></div></div>
 <div id="stage">1 · Разделяне</div>
 <div id="status" role="status" aria-live="polite">Раздалечи двата палеца ↙ ↘</div>
 <div class="energy left"><span class="dot" style="background:#69aaa7"></span><span class="meter"><span id="e0fill" class="fill" style="background:#69aaa7;display:block"></span></span><span class="pct" id="e0">80%</span></div>
 <div class="energy right"><span class="dot" style="background:#ed997b"></span><span class="meter"><span id="e1fill" class="fill" style="background:#ed997b;display:block"></span></span><span class="pct" id="e1">40%</span></div>
 <div id="progress">Едното е по-бързо, другото — по-бавно.</div>
 <div id="feedback"></div>
 <div class="zone" id="left-zone"><div class="pad" id="left-pad"><div class="knob" id="left-knob"></div></div><div class="hint">ЛЯВ ПАЛЕЦ</div></div>
 <div class="zone" id="right-zone"><div class="pad" id="right-pad"><div class="knob" id="right-knob"></div></div><div class="hint">ДЕСЕН ПАЛЕЦ</div></div>
 <div id="finish"><div class="flower">✺</div><h2>Отново заедно</h2><p>Две различни енергии намериха общ ритъм и съживиха светлината.</p><button id="again">Още един ден</button></div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx){$('status').textContent='Браузърът не поддържа тази игра.';return;}
const T='#69aaa7',O='#ed997b',Y='#e5b35f',V='#84748e';
const sticks=[{id:null,x:0,y:0,startX:0,startY:0,lastX:0,lastY:0},{id:null,x:0,y:0,startX:0,startY:0,lastX:0,lastY:0}];
let W=window.innerWidth,H=window.innerHeight,dpr=1,g,prev=0,frameId=0;
const minmax=(x,a,b)=>Math.max(a,Math.min(b,x));
const magnitude=(x,y)=>Math.hypot(x,y);
const ballRadius=()=>minmax(Math.min(W,H)*.026,17,24);
function say(t){$('status').textContent=t}
function disp(t){$('feedback').textContent=t}
function resetThumb(n){const s=sticks[n];s.id=null;s.x=s.y=0;$(n?'right-knob':'left-knob').style.transform='translate(-50%,-50%)'}
function phase(name){g.phase=name;g.phaseAt=g.time; updateHud()}
function updateHud(){
 const labels={morning:'1 · Сутрин',day:'2 · Всеки по пътя си',evening:'3 · Общ ритъм',together:'4 · Заедно',win:'✓ Завършено'};
 $('stage').textContent=labels[g.phase];
 for(let n=0;n<2;n++){const energy=Math.round(g.energy[n]);$('e'+n).textContent=energy+'%';$('e'+n+'fill').style.width=energy+'%'}
 if(g.phase==='morning')$('progress').textContent='Раздалечи двата палеца, за да се разделят.';
 if(g.phase==='day')$('progress').textContent='Светлинки: 🩵 '+g.picks[0]+'/2　🧡 '+g.picks[1]+'/2';
 if(g.phase==='evening')$('progress').textContent='Потъркване '+Math.round(g.rub/95*100)+'%　·　Обикаляне '+Math.round(g.orbit/(Math.PI*1.7)*100)+'%';
 if(g.phase==='together')$('progress').textContent='Заведете общата светлина до златното цвете ✺';
 if(g.phase==='win')$('progress').textContent='Благодаря, че бяхте заедно.';
}
function newState(){
 const r=ballRadius(),cy=H*.70;
 g={phase:'morning',phaseAt:0,time:0,one:{x:W*.5,y:cy},balls:[{x:W*.5-r*2.4,y:cy},{x:W*.5+r*2.4,y:cy}],energy:[82,44],picks:[0,0],pickups:[],vortices:[],rub:0,orbit:0,orbitDirection:0,rubSignal:0,particles:[],completing:false,splitCountdown:0,flower:{x:W*.5,y:Math.max(195,H*.34),r:31},lastDangerText:0};
 for(let n=0;n<2;n++)resetThumb(n);
 buildScene();updateHud();disp('');say('Двамата започват заедно. Раздалечи палците ↙ ↘');$('finish').classList.remove('show');prev=0;
}
function buildScene(){
 g.pickups=[];
 // Stable target positions keep the scene understandable instead of turning into a chase.
 for(let n=0;n<2;n++){
  const cx=W*(n?.76:.24);
  for(let i=0;i<3;i++)g.pickups.push({side:n,x:cx+W*(i===1?.055:i===2?-.045:0),y:H*(.59-i*.14),r:15,used:false});
 }
 g.vortices=[{x:W*.41,y:H*.44,r:minmax(Math.min(W,H)*.078,42,72),spin:.7},
             {x:W*.61,y:H*.60,r:minmax(Math.min(W,H)*.069,40,63),spin:-.8}];
 g.flower={x:W*.5,y:Math.max(160,H*.31),r:clampSize(30,40)};
}
function clampSize(a,b){return minmax(Math.min(W,H)*.055,a,b)}
function resize(){
 const ow=W,oh=H;
 W=Math.max(320,$('app').clientWidth||window.innerWidth);H=Math.max(340,$('app').clientHeight||window.innerHeight);
 dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 if(g){
  for(const p of [g.one,...g.balls]){p.x*=W/ow;p.y*=H/oh}
  buildScene();updateHud();
 }
}
function startDay(){
 const r=ballRadius();const base=minmax(g.one.x,W*.25,W*.75);
 g.balls=[{x:Math.max(r,base-r*2.9),y:g.one.y},{x:Math.min(W-r,base+r*2.9),y:g.one.y}];
 phase('day');say('Всеки събира своята светлина. Пази се от тъмните вихри!');disp('');
}
function startEvening(){
 phase('evening');g.rub=0;g.orbit=0;g.orbitDirection=0;g.rubSignal=0;
 // Keep the positions found by the player, enabling an actual reunion maneuver.
 say('Съберете се: потъркайте се или синьото да обиколи оранжевото.');disp('Два начина да намерите общ ритъм');
}
function startTogether(){
 const a=g.balls[0],b=g.balls[1];g.one={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 phase('together');say('Успяхте! Сега заедно съживете златното цвете.');disp('✦ Една светлина от две различни');
 spark(g.one.x,g.one.y,Y,26);
 for(let n=0;n<2;n++){
  const s=sticks[n];if(s.id!==null){s.startX=s.lastX;s.startY=s.lastY}
 }
}
function win(){phase('win');spark(g.flower.x,g.flower.y,Y,44);$('finish').classList.add('show')}
function spark(x,y,col,n=9){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=35+Math.random()*90;g.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.7+Math.random()*.4,c:col})}}
function applyMove(n,dx,dy){
 if(!g||g.phase==='win')return;
 const s=sticks[n];
 if(g.phase==='morning'){
  const both=sticks[0].id!==null&&sticks[1].id!==null;
  if(both&&sticks[0].x< -22&&sticks[1].x>22)startDay();
  else if(!both){moveOne(dx,dy,1.0)}
  return;
 }
 if(g.phase==='together'){
  const count=(sticks[0].id!==null?1:0)+(sticks[1].id!==null?1:0);
  moveOne(dx,dy,count===2?.65:1);return;
 }
 const p=g.balls[n],old={x:p.x,y:p.y},energy=g.energy[n];
 const scale=(n===0?1.26:.80)*(.72+.28*energy/100);
 const gain=1.45*scale,r=ballRadius();
 // Pointer displacement, not joystick angle. Reverse direction instantly.
 p.x=minmax(p.x+minmax(dx,-55,55)*gain,r,W-r);
 p.y=minmax(p.y+minmax(dy,-55,55)*gain,Math.max(168,H*.19),H-r);
 if(g.phase==='day'){
  checkPickups(n);
  checkDanger(n,Math.hypot(p.x-old.x,p.y-old.y));
  if(g.picks[0]>=2&&g.picks[1]>=2)startEvening();
 }
 if(g.phase==='evening')processReunion(n,old,p);
}
function moveOne(dx,dy,mult){
 const r=ballRadius();
 g.one.x=minmax(g.one.x+minmax(dx,-55,55)*1.42*mult,r,W-r);
 g.one.y=minmax(g.one.y+minmax(dy,-55,55)*1.42*mult,Math.max(175,H*.20),H-r);
 if(g.phase==='together'&&Math.hypot(g.one.x-g.flower.x,g.one.y-g.flower.y)<r+g.flower.r*.62)win();
}
function checkPickups(n){
 for(const p of g.pickups){if(p.used||p.side!==n)continue;
  if(Math.hypot(g.balls[n].x-p.x,g.balls[n].y-p.y)<=ballRadius()+p.r+5){
   p.used=true;g.picks[n]++;g.energy[n]=Math.min(100,g.energy[n]+13);spark(p.x,p.y,n?O:T,10);updateHud();
  }
 }
}
function checkDanger(n){
 for(const v of g.vortices){const d=Math.hypot(g.balls[n].x-v.x,g.balls[n].y-v.y);
  if(d<v.r*.85){// Energy drains per second in animate(), not per finger-motion event.
   if(g.time-g.lastDangerText>1.4){say('Вихър! Излез от тъмната зона, преди да изгубиш енергия.');g.lastDangerText=g.time;}
   updateHud();
  }
 }
}
function orbitRange(){return minmax(Math.min(W*.14,H*.12),58,130)}
function processReunion(n,old,p){
 const a=g.balls[0],b=g.balls[1],sep=Math.hypot(a.x-b.x,a.y-b.y),r=ballRadius();
 const oldSep=Math.hypot(old.x-g.balls[1-n].x,old.y-g.balls[1-n].y);
 const movement=Math.hypot(p.x-old.x,p.y-old.y);
 if(movement<.5)return;
 if(sep<=r*2+30&&sep>9){
  // Tangential rubbing near contact, not just crashing or standing still.
  const other=g.balls[1-n],ux=(p.x-other.x)/sep,uy=(p.y-other.y)/sep;
  const along=Math.abs((p.x-old.x)*(-uy)+(p.y-old.y)*ux);
  if(sep<=r*2+22&&Math.abs(oldSep-sep)<22)g.rub+=Math.min(along,23)*.95;
 }
 if(n===0&&sep>=r*2+16&&sep<=orbitRange()){
  // Measure the signed angular travel of the fast light around the slow light.
  const center=b;
  const a0=Math.atan2(old.y-center.y,old.x-center.x),a1=Math.atan2(p.y-center.y,p.x-center.x);
  let diff=a1-a0;
  while(diff>Math.PI)diff-=Math.PI*2;while(diff< -Math.PI)diff+=Math.PI*2;
  if(Math.abs(diff)<.55&&Math.abs(diff)>.002){
   const dir=Math.sign(diff);
   if(g.orbitDirection===0||g.orbitDirection===dir){g.orbit+=Math.abs(diff);g.orbitDirection=dir;}
   else{g.orbit=Math.max(0,g.orbit-Math.abs(diff)*1.35);if(g.orbit===0)g.orbitDirection=dir;}
  }
 }
 if(g.rub>=95||g.orbit>=Math.PI*1.7){startTogether();return;}
 updateHud();
}
function attach(n){
 const zone=$(n?'right-zone':'left-zone'),knob=$(n?'right-knob':'left-knob'),pad=$(n?'right-pad':'left-pad'),s=sticks[n];
 function move(x,y){
  const dx=x-s.lastX,dy=y-s.lastY;s.lastX=x;s.lastY=y;
  s.x=x-s.startX;s.y=y-s.startY;
  applyMove(n,dx,dy);
  const maxR=pad.offsetWidth*.37,dist=magnitude(s.x,s.y),factor=dist>maxR?maxR/dist:1;
  knob.style.transform='translate(-50%,-50%) translate('+(s.x*factor)+'px,'+(s.y*factor)+'px)';
 }
 function begin(id,x,y){if(s.id!==null)return false;s.id=id;s.x=s.y=0;s.startX=s.lastX=x;s.startY=s.lastY=y;knob.style.transform='translate(-50%,-50%)';return true}
 function end(id){if(s.id===id)resetThumb(n)}
 if(window.PointerEvent){
  zone.addEventListener('pointerdown',e=>{e.preventDefault();if(begin(e.pointerId,e.clientX,e.clientY))try{zone.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
  zone.addEventListener('pointermove',e=>{if(e.pointerId===s.id){e.preventDefault();move(e.clientX,e.clientY)}},{passive:false});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>zone.addEventListener(t,e=>end(e.pointerId)));
  window.addEventListener('pointerup',e=>end(e.pointerId));
 }else{
  zone.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)if(begin(t.identifier,t.clientX,t.clientY))break},{passive:false});
  zone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===s.id)move(t.clientX,t.clientY)},{passive:false});
  ['touchend','touchcancel'].forEach(type=>zone.addEventListener(type,e=>{for(const t of e.changedTouches)end(t.identifier)}));
 }
 zone.addEventListener('contextmenu',e=>e.preventDefault());
}
attach(0);attach(1);
function drawCircle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function line(x1,y1,x2,y2,c,w=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}
function ball(p,color,r=ballRadius(),alpha=1){
 ctx.save();ctx.globalAlpha=alpha;drawCircle(p.x,p.y,r+7,color+'25');drawCircle(p.x,p.y,r,color);drawCircle(p.x-r*.24,p.y-r*.34,r*.16,'#ffffffae');ctx.restore();
}
function oneBall(p){const r=ballRadius();ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.clip();ctx.fillStyle=T;ctx.fillRect(p.x-r,p.y-r,r,r*2);ctx.fillStyle=O;ctx.fillRect(p.x,p.y-r,r,r*2);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.stroke()}
function field(){
 ctx.fillStyle='#fdf9f2';ctx.fillRect(0,0,W,H);
 const upper=Math.max(160,H*.16);
 ctx.fillStyle='#eef7f2';ctx.fillRect(0,upper,W*.485,H-upper);ctx.fillStyle='#fff3ec';ctx.fillRect(W*.515,upper,W*.485,H-upper);
 const gradient=ctx.createLinearGradient(W*.45,0,W*.55,0);gradient.addColorStop(0,'#fffaf400');gradient.addColorStop(.5,'#fff9f2');gradient.addColorStop(1,'#fffaf400');ctx.fillStyle=gradient;ctx.fillRect(W*.44,upper,W*.12,H-upper);
 ctx.save();ctx.setLineDash([4,13]);line(W*.5,upper,W*.5,H,'#c3d7cb',1.3);ctx.restore();
 for(let i=0;i<9;i++){const y=upper+i*(H-upper)/8;line(W*.07,y,W*.41,y,'#b2d8cd3b',1);line(W*.59,y,W*.93,y,'#f5b9a33b',1)}
}
function drawVortex(v){
 const pulse=.95+.05*Math.sin(g.time*1.5),r=v.r*pulse;
 const halo=ctx.createRadialGradient(v.x,v.y,2,v.x,v.y,r*1.35);halo.addColorStop(0,'#76647b8c');halo.addColorStop(.5,'#8f809f48');halo.addColorStop(1,'#8f809f00');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(v.x,v.y,r*1.35,0,6.283);ctx.fill();
 ctx.strokeStyle='#78677e9c';ctx.lineWidth=2.5;
 for(let i=0;i<3;i++){
  ctx.beginPath();const start=g.time*v.spin+i*2.094;
  for(let j=0;j<=34;j++){const t=j/34,angle=start+t*4.8,rr=r*(.15+.75*t);if(j===0)ctx.moveTo(v.x+Math.cos(angle)*rr,v.y+Math.sin(angle)*rr);else ctx.lineTo(v.x+Math.cos(angle)*rr,v.y+Math.sin(angle)*rr)}ctx.stroke();
 }
}
function flower(){const p=g.flower,glow=g.phase==='win'?1:0,r=p.r;
 ctx.save();ctx.translate(p.x,p.y);
 ctx.strokeStyle='#cc9c4a';ctx.lineWidth=3;for(let k=0;k<7;k++){ctx.rotate(Math.PI*2/7);ctx.beginPath();ctx.ellipse(0,-r*.55,r*.34,r*.52,0,0,6.283);ctx.fillStyle=glow?'#fce39a':'#ead6b185';ctx.fill();ctx.stroke()}
 drawCircle(0,0,r*.28,glow?'#ffebaa':'#dcc38b');ctx.restore();
}
function draw(){if(!g)return;
 field();const phase=g.phase;
 if(phase==='day'){
  for(const v of g.vortices)drawVortex(v);
  for(const orb of g.pickups)if(!orb.used){const c=orb.side?O:T;drawCircle(orb.x,orb.y,orb.r+8,c+'27');drawCircle(orb.x,orb.y,orb.r,c);drawCircle(orb.x-4,orb.y-4,3,'#fff');}
 }
 if(phase==='together'||phase==='win')flower();
 if(phase==='morning'||phase==='together'||phase==='win')oneBall(g.one);
 else{
  if(phase==='evening'){
   const r=ballRadius(),b=g.balls[1];
   ctx.strokeStyle='#e7ac63a3';ctx.lineWidth=2;ctx.setLineDash([3,9]);ctx.beginPath();ctx.arc(b.x,b.y,orbitRange(),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
   // Small orbit progress halo around the slower light.
   ctx.strokeStyle=Y;ctx.lineWidth=4;ctx.beginPath();ctx.arc(b.x,b.y,r+12,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,Math.max(g.rub/95,g.orbit/(Math.PI*1.7))));ctx.stroke();
  }
  ball(g.balls[0],T);ball(g.balls[1],O);
 }
 for(const p of g.particles)drawCircle(p.x,p.y,3.5*p.t,p.c);
}
function animate(t){if(!prev)prev=t;const dt=Math.min(.045,(t-prev)/1000);prev=t;
 if(g){g.time+=dt;if(g.phase==='day'){
   // Danger drains while inside even when the thumb is held still.
   let danger=false;
   for(let n=0;n<2;n++)for(const v of g.vortices)if(Math.hypot(g.balls[n].x-v.x,g.balls[n].y-v.y)<v.r*.85){g.energy[n]=Math.max(12,g.energy[n]-9.5*dt);danger=true}
   if(danger)updateHud();
  }
  for(let i=g.particles.length-1;i>=0;i--){const p=g.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.t<=0)g.particles.splice(i,1)}
 }
 draw();frameId=requestAnimationFrame(animate)}
function showHelp(){const text={morning:'Дръпни двата палеца навън. Топчетата ще се разделят.',day:'Плъзвай двата палеца. Синьото е по-бързо. Събери по две светлинки от всеки цвят. Избягвай лилавите вихри.',evening:'Потъркай топчетата едно покрай друго или направи почти пълен кръг със синьото около оранжевото. Оранжевото може да стои на място.',together:'Съединеното топче се движи с който и да е палец. Докосни златното цвете.',win:'Натисни „Още един ден“ за ново начало.'};say(text[g.phase]);}
$('instructions').addEventListener('click',showHelp);
$('restart').addEventListener('click',newState);$('again').addEventListener('click',newState);
window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
document.addEventListener('visibilitychange',()=>{prev=0;if(document.hidden)for(let n=0;n<2;n++)resetThumb(n)});
window.addEventListener('pagehide',()=>{prev=0;for(let n=0;n<2;n++)resetThumb(n)});
window.addEventListener('blur',()=>{prev=0;for(let n=0;n<2;n++)resetThumb(n)});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
resize();newState();frameId=requestAnimationFrame(animate);
// Read-only diagnostics for reproducible interaction tests.
window.duoQA=()=>({phase:g.phase,energy:g.energy.slice(),picks:g.picks.slice(),rub:g.rub,orbit:g.orbit,ballPositions:g.balls.map(p=>({x:p.x,y:p.y})),joined:{...g.one},vortices:g.vortices.map(v=>({x:v.x,y:v.y,r:v.r})),pickups:g.pickups.map(p=>({...p})),flower:{...g.flower},W,H});
})();
</script>
