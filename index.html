<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182b26"><title>Шах за двама · Tabletop Edition</title><style>
:root{color-scheme:dark;--forest:#142820;--panel:#233d32;--cream:#f1e6d0;--gold:#e6bd77;--light:#eadbc0;--dark:#997a5c}
*{box-sizing:border-box}html{min-height:100%;background:var(--forest)}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 40%,#294638 0%,#182e25 60%,#10221b 100%);color:var(--cream);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{--board-size:min(94vw,calc(100dvh - 256px),690px);width:min(96vw,710px);min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.clock{width:var(--board-size);height:clamp(54px,8dvh,76px);border-radius:13px;background:var(--panel);border:1px solid #ffffff20;display:flex;justify-content:center;align-items:center;font-size:clamp(32px,5.5vw,47px);font-variant-numeric:tabular-nums;font-weight:720;letter-spacing:2px;box-shadow:0 5px 18px #0002;transition:background .15s,color .15s}
.clock.active{background:var(--gold);color:#182b23;border-color:#f6d99e;box-shadow:0 0 0 2px #e6bd7740,0 5px 22px #0003}.clock.low{background:#ad4d44;color:white;border-color:#d97869}.clock.black{transform:rotate(180deg)}
.player{width:var(--board-size);display:flex;align-items:center;justify-content:space-between;margin:1px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#d5d6c7;min-height:17px}.player.black-player{transform:rotate(180deg)}
.board{width:var(--board-size);height:var(--board-size);flex:none;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));touch-action:none;user-select:none;overflow:hidden;border-radius:3px;border:5px solid #c5a47b;box-shadow:0 0 0 1px #0d1c17,0 14px 38px #0006}
.square{position:relative;display:grid;place-items:center;width:100%;height:100%;min-width:0;min-height:0;font-size:clamp(24px,calc(var(--board-size) / 9.4),72px);line-height:1;cursor:pointer}.light{background:var(--light)}.dark{background:var(--dark)}
.square.last{box-shadow:inset 0 0 0 100px #e8ce6a55}.square.selected{box-shadow:inset 0 0 0 100px #f0c14b99}.square.target:after{content:"";position:absolute;width:23%;height:23%;background:#285d4c99;border-radius:50%;pointer-events:none}.square.capture:after{width:83%;height:83%;border:5px solid #285d4caa;background:none}
.piece-svg{display:block;width:91%;height:91%;overflow:visible;filter:drop-shadow(0 2px 1px #0004)}.piece{pointer-events:none;display:grid;place-items:center;width:100%;height:100%;font-family:"DejaVu Sans","Apple Symbols","Segoe UI Symbol",serif;text-shadow:0 2px 2px #0005}.whitepiece{color:#fff9e9;-webkit-text-stroke:1.1px #3d423a}.blackpiece{color:#444;-webkit-text-stroke:.7px #222}
.toolbar{width:var(--board-size);display:flex;gap:8px;margin:3px 0 0}button,select{font:inherit;border:0;border-radius:10px;padding:11px 13px;background:var(--gold);color:#172a21;font-weight:680;cursor:pointer;touch-action:manipulation}button.secondary{background:#345145;color:#f8f2e6}button:disabled{opacity:.38}.toolbar button{flex:1;min-width:0;font-size:13px;background:#345145;color:#f8f2e6;border:1px solid #ffffff15}.toolbar #new{background:#294438;color:#e5e5d7}
#message{width:var(--board-size);text-align:center;min-height:20px;margin:2px 0 0;color:#f0d7a3;font-size:13px;font-weight:600}#moves{width:var(--board-size);font-size:11px;color:#b9c7b9;text-align:center;max-height:32px;overflow:auto}
.overlay{position:fixed;inset:0;background:#0a1712e8;z-index:5;display:grid;place-items:center;padding:16px}.modal{width:min(94vw,440px);padding:26px;background:#f6f0e3;color:#1d3026;border-radius:20px;box-shadow:0 20px 80px #0008}.modal h1{margin:0 0 12px;font-size:28px}.modal p{line-height:1.45}.modal label{display:block;margin:15px 0 7px;font-weight:650}.modal select,.modal button{width:100%;margin-bottom:8px}.modal select{background:#fff;border:1px solid #a8a99e}.hidden{display:none!important}#promotion button{width:23%;font-size:26px;padding:10px 0}#promotion{display:flex;gap:2%;margin-top:10px}.footer{width:var(--board-size);font-size:10px;text-align:center;color:#aebdaf;margin-top:1px}
@media(max-height:700px){main{--board-size:min(92vw,calc(100dvh - 214px),620px);gap:3px}.clock{height:49px;font-size:30px}.toolbar button{padding:8px 7px}.player{font-size:10px;min-height:14px}.footer{display:none}}
@media(min-width:900px) and (orientation:landscape){main{--board-size:min(72dvh,65vw,690px)}}
.undo-opponent{font-size:12px;padding:5px 11px;border-radius:7px;background:#345145;color:#f8f2e6;border:1px solid #ffffff22;letter-spacing:0;text-transform:none}.undo-opponent:disabled{opacity:.38}</style></head><body><main><div class="clock black" id="blackClock">10:00</div><div class="player black-player"><span>● Черни</span><button id="undoBlack" class="undo-opponent" type="button">↶ Ход назад</button></div><div class="board" id="board"></div><div class="player"><span>○ Бели</span><span id="whiteState"></span></div><div class="clock" id="whiteClock">10:00</div><div id="message"></div><div class="toolbar"><button id="pause" class="secondary">Пауза</button><button id="undo" class="secondary">↶ Ход назад</button><button id="new">Нова партия</button></div><div id="moves"></div><div class="footer">Дъската не се завърта · Докосване или влачене · Запазва се автоматично</div></main>
<div class="overlay" id="setup"><div class="modal"><h1>♟ Шах за двама</h1><p>Изберете времето преди началото на партията.</p><label for="minutes">Време на играч</label><select id="minutes"><option value="3">3 минути</option><option value="5">5 минути</option><option value="10" selected>10 минути</option><option value="15">15 минути</option><option value="30">30 минути</option><option value="0">Без лимит — отчитане на времето</option></select><label for="increment">Добавка след всеки ход</label><select id="increment"><option value="0">Без добавка</option><option value="2">+2 секунди</option><option value="5">+5 секунди</option></select><button id="start">Започни партията</button><button id="resume" class="secondary hidden">Продължи запазената партия</button><p style="font-size:12px">Белите са откъм долната страна. Черните са откъм горната.</p></div></div>
<div class="overlay hidden" id="promoOverlay"><div class="modal"><h1>Превръщане на пешка</h1><p>Изберете новата фигура.</p><div id="promotion"></div></div></div>
<script>
const FEN0="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const D={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]};
const ok=i=>i>=0&&i<128&&!(i&136), col=p=>!p||p==='.'?0:p===p.toUpperCase()?1:-1;
const si=x=>(8-Number(x[1]))*16+'abcdefgh'.indexOf(x[0]);
const ss=i=>'abcdefgh'[i&7]+(8-(i>>4));
function fresh(){let b=Array(128).fill('.');FEN0.split(' ')[0].split('/').forEach((row,r)=>{let c=0;for(const p of row){if(/[1-8]/.test(p))c+=Number(p);else b[r*16+c++]=p;}});return {b,t:1,c:15,ep:-1,half:0,full:1};}
function attack(s,target,by){for(let f=0;f<128;f++){if(!ok(f)||col(s.b[f])!==by)continue;let p=s.b[f].toLowerCase();if(p==='p'){if(target===f-16*by-1||target===f-16*by+1)return true;continue;}for(const d of (D[p]||D.k))for(let t=f+d;ok(t);t+=d){if(t===target)return true;if(s.b[t]!=='.'||p==='n'||p==='k')break;}}return false;}
const check=(s,c=s.t)=>attack(s,s.b.indexOf(c===1?'K':'k'),-c);
function next(s,m){let [f,t,pr,flag]=m,b=s.b.slice(),piece=b[f],capt=b[t],c=s.c;b[f]='.';b[t]=pr?(s.t===1?pr.toUpperCase():pr):piece;if(flag==='ep')b[t+16*s.t]='.';if(flag==='castle'){let rf=t>f?f+3:f-4,rt=t>f?f+1:f-1;b[rt]=b[rf];b[rf]='.';}if(piece==='K')c&=~3;if(piece==='k')c&=~12;const bits={119:1,112:2,7:4,0:8};if(piece.toLowerCase()==='r')c&=~(bits[f]||0);if(capt.toLowerCase()==='r')c&=~(bits[t]||0);return {b,t:-s.t,c,ep:piece.toLowerCase()==='p'&&Math.abs(t-f)===32?(t+f)/2:-1,half:piece.toLowerCase()==='p'||capt!=='.'||flag==='ep'?0:s.half+1,full:s.full+(s.t===-1?1:0)};}
function moves(s){let a=[];for(let f=0;f<128;f++){if(!ok(f)||col(s.b[f])!==s.t)continue;let p=s.b[f].toLowerCase();const add=(t,flag='')=>{if(s.b[t].toLowerCase()==='k')return;if(p==='p'&&((t>>4)===0||(t>>4)===7))for(const pr of ['q','r','b','n'])a.push([f,t,pr,flag]);else a.push([f,t,'',flag]);};if(p==='p'){let t=f-16*s.t;if(ok(t)&&s.b[t]==='.'){add(t);let u=t-16*s.t;if((f>>4)===(s.t===1?6:1)&&s.b[u]==='.')add(u);}for(const d of [-1,1]){let u=t+d;if(!ok(u))continue;if(col(s.b[u])===-s.t)add(u);else if(u===s.ep&&s.b[u]==='.'&&s.b[u+16*s.t]===(s.t===1?'p':'P'))add(u,'ep');}}else{for(const d of (D[p]||D.k))for(let t=f+d;ok(t);t+=d){if(col(s.b[t])===s.t)break;add(t);if(s.b[t]!=='.'||p==='n'||p==='k')break;}let home=s.t===1?116:4,rook=s.t===1?'R':'r',bits=s.t===1?[1,2]:[4,8];if(p==='k'&&f===home&&!check(s)){if((s.c&bits[0])&&s.b[f+3]===rook&&s.b[f+1]==='.'&&s.b[f+2]==='.'&&!attack(s,f+1,-s.t)&&!attack(s,f+2,-s.t))add(f+2,'castle');if((s.c&bits[1])&&s.b[f-4]===rook&&s.b[f-1]==='.'&&s.b[f-2]==='.'&&s.b[f-3]==='.'&&!attack(s,f-1,-s.t)&&!attack(s,f-2,-s.t))add(f-2,'castle');}}}return a.filter(m=>!check(next(s,m),s.t));}
class Chess {
 constructor(){this.states=[fresh()];this.notation=[];}
 state(){return this.states[this.states.length-1]}
 turn(){return this.state().t===1?'w':'b'}
 get(square){const p=this.state().b[si(square)];return p==='.'?null:{type:p.toLowerCase(),color:col(p)===1?'w':'b'}}
 board(){return Array.from({length:8},(_,r)=>Array.from({length:8},(_,f)=>this.get(ss(r*16+f))))}
 moves(opts={}){
   const s=this.state(), ms=moves(s).filter(m=>!opts.square||ss(m[0])===opts.square);
   if(opts.verbose)return ms.map(m=>({from:ss(m[0]),to:ss(m[1]),promotion:m[2]||undefined,flags:m[3]==='castle'?'k':m[3]==='ep'?'e':m[2]?'p':'n',color:this.turn(),_raw:m}));
   return ms.map(m=>ss(m[0])+'-'+ss(m[1]));
 }
 move({from,to,promotion='q'}){
   const m=moves(this.state()).find(x=>ss(x[0])===from&&ss(x[1])===to&&(!x[2]||x[2]===promotion));
   if(!m)return null;
   const s=this.state(), label=ss(m[0])+'–'+ss(m[1])+(m[2]?'='+m[2].toUpperCase():'');
   this.states.push(next(s,m));this.notation.push(label);
   return {from,to,color:s.t===1?'w':'b'};
 }
 undo(){if(this.states.length<2)return null;this.states.pop();this.notation.pop();return true}
 history(){return this.notation.slice()}
 isCheck(){return check(this.state())}
 isCheckmate(){return this.isCheck()&&moves(this.state()).length===0}
 isGameOver(){return moves(this.state()).length===0}
 pgn(){return JSON.stringify(this.notation)}
 loadPgn(pgn){const a=JSON.parse(pgn||'[]');this.states=[fresh()];this.notation=[];for(const t of a){const match=t.match(/^([a-h][1-8])–([a-h][1-8])(?:=([QRBN]))?$/);if(!match||!this.move({from:match[1],to:match[2],promotion:(match[3]||'q').toLowerCase()}))throw Error('Invalid save')}}
}

const $=id=>document.getElementById(id), symbols={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎'}};
const pieceArt={"p":"<circle cx=\"32\" cy=\"17\" r=\"8.5\"/><path d=\"M26 25 L23 30 L27 33 Q26 39 20 44 Q16 48 16 51 H48 Q48 48 44 44 Q38 39 37 33 L41 30 L38 25 Z\"/><path d=\"M17 51 H47 V55 H17 Z\"/>","r":"<path d=\"M14 12 H21 V18 H27 V12 H37 V18 H43 V12 H50 L47 27 H17 Z\"/><path d=\"M21 29 H43 L41 46 H23 Z\"/><path d=\"M17 47 H47 V54 H17 Z\"/>","n":"<path d=\"M17 46 Q21 41 20 37 L13 35 Q9 32 13 27 L20 19 L24 11 Q28 8 34 12 L42 18 Q46 23 47 30 L49 37 Q50 41 45 43 L38 39 L34 33 L30 41 L32 47 Z\"/><path d=\"M14 49 H49 V55 H14 Z\"/><path d=\"M17 29 L23 31 L27 27\" fill=\"none\" stroke=\"var(--detail)\" stroke-width=\"2.5\"/><circle cx=\"32\" cy=\"20\" r=\"2.5\" fill=\"var(--detail)\" stroke=\"none\"/>","b":"<circle cx=\"32\" cy=\"9\" r=\"4\"/><path d=\"M31 14 Q20 17 22 28 Q24 35 25 39 L20 46 H44 L39 39 Q40 35 42 28 Q44 17 33 14 Z\"/><path d=\"M35 17 L29 34\" fill=\"none\" stroke=\"var(--detail)\" stroke-width=\"3.2\"/><path d=\"M18 47 H46 V54 H18 Z\"/>","q":"<circle cx=\"11\" cy=\"15\" r=\"4\"/><circle cx=\"23\" cy=\"10\" r=\"4\"/><circle cx=\"41\" cy=\"10\" r=\"4\"/><circle cx=\"53\" cy=\"15\" r=\"4\"/><path d=\"M12 21 L20 44 H44 L52 21 L42 32 L32 18 L22 32 Z\"/><path d=\"M18 46 H46 V54 H18 Z\"/>","k":"<path d=\"M32 5 V19 M24 12 H40\" fill=\"none\" stroke-width=\"4.5\"/><path d=\"M27 21 Q21 17 17 23 Q11 33 24 42 H40 Q53 33 47 23 Q43 17 37 21 Q35 17 32 17 Q29 17 27 21 Z\"/><path d=\"M25 28 Q32 24 39 28 L35 39 H29 Z\" fill=\"none\" stroke=\"var(--detail)\" stroke-width=\"2\"/><path d=\"M20 44 H44 V49 H20 Z\"/><path d=\"M16 50 H48 V56 H16 Z\"/>"};
function pieceSVG(type,color){const light=color==='w';return `<svg class="piece-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="--fill:${light?'#fafafa':'#4b4b4b'};--edge:${light?'#262626':'#202020'};--detail:${light?'#777':'#252525'}"><g fill="var(--fill)" stroke="var(--edge)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">${pieceArt[type]}</g></svg>`}
let game=new Chess(),time={w:600000,b:600000},initial=600000,inc=0,unlimited=false,started=false,paused=false,finished=false,selected=null,last=null,history=[],lastTick=performance.now(),pending=null,press=null,ignoreClick=false;
const storage='chess-tablet-v1';
function fmt(ms){const sec=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function save(){try{localStorage.setItem(storage,JSON.stringify({pgn:game.pgn(),time,initial,inc,unlimited,started,paused,finished,history,last}));}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(storage));if(!x)return false;const g=new Chess();g.loadPgn(x.pgn||'');game=g;time=x.time;initial=x.initial;inc=x.inc;unlimited=x.unlimited;started=x.started;paused=true;finished=x.finished;history=x.history||[];last=x.last||null;return true}catch(e){return false}}
function status(){if(finished){if(!unlimited&&(time.w<=0||time.b<=0)){const loser=time.w<=0?'w':'b';const winner=loser==='w'?'Черните':'Белите';const other=game.board().flat().filter(Boolean).filter(p=>p.color!==loser&&p.type!=='k');return other.length===0||other.every(p=>p.type==='n'||p.type==='b')&&other.length===1?'Реми — недостатъчен материал за мат':winner+' печелят по време';}if(game.isCheckmate())return (game.turn()==='w'?'Черните':'Белите')+' печелят с мат!';return 'Реми — партията приключи.'}if(paused)return history.length?'Пауза':'Белите започват — часовникът тръгва след първия ход';return (game.turn()==='w'?'Белите':'Черните')+' са на ход'+(game.isCheck()?' — шах!':'')}
function updateClocks(){for(const c of ['w','b']){const el=$(c==='w'?'whiteClock':'blackClock');el.textContent=fmt(time[c]);el.classList.toggle('active',started&&!paused&&!finished&&game.turn()===c);el.classList.toggle('low',!unlimited&&time[c]<=30000);}}
function render(){const board=$('board');board.innerHTML='';const options=selected?game.moves({square:selected,verbose:true}):[];for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq='abcdefgh'[f]+r,p=game.get(sq),el=document.createElement('div');el.className='square '+(((8-r+f)%2)?'dark':'light');el.dataset.square=sq;if(last&&(last.from===sq||last.to===sq))el.classList.add('last');if(selected===sq)el.classList.add('selected');if(options.some(m=>m.to===sq))el.classList.add(p?'capture':'target');if(p){const span=document.createElement('span');span.className='piece '+(p.color==='w'?'whitepiece':'blackpiece');span.innerHTML=pieceSVG(p.type,p.color);el.append(span);}board.append(el)}$('message').textContent=status();$('moves').textContent=game.history().map((m,i)=>(i%2===0?Math.floor(i/2)+1+'. ':'')+m).join('  ');$('pause').textContent=paused?'Продължи':'Пауза';$('pause').disabled=!started||finished;const canUndo=history.length>0;$('undo').disabled=!canUndo;$('undoBlack').disabled=!canUndo;updateClocks();}
function move(from,to,promotion){if(finished||(!started))return;const choices=game.moves({square:from,verbose:true}).filter(m=>m.to===to);if(!choices.length)return;if(choices.some(m=>m.flags.includes('p'))&&!promotion){pending={from,to};$('promotion').innerHTML='';for(const type of ['q','r','b','n']){const b=document.createElement('button');b.textContent=symbols[game.turn()][type];b.onclick=()=>{const p=pending;pending=null;$('promoOverlay').classList.add('hidden');move(p.from,p.to,type)};$('promotion').append(b)}$('promoOverlay').classList.remove('hidden');return}const snapshot={time:{...time},last,started,paused,finished};try{const m=game.move({from,to,promotion:promotion||'q'});if(!m)return;history.push(snapshot);if(!unlimited)time[m.color]+=inc*1000;last={from,to};selected=null;started=true;paused=false;finished=game.isGameOver();lastTick=performance.now();render();save()}catch(e){}}
function select(sq){if(finished||!started)return;const p=game.get(sq);if(selected){const from=selected;if(p&&p.color===game.turn()){selected=sq;render();return}move(from,sq);selected=null;render();return}if(p&&p.color===game.turn()){selected=sq;render()}}
$('board').addEventListener('pointerdown',e=>{const s=e.target.closest('.square');if(!s)return;press={square:s.dataset.square,x:e.clientX,y:e.clientY};});
$('board').addEventListener('pointerup',e=>{if(!press)return;const p=press;press=null;const moved=Math.hypot(e.clientX-p.x,e.clientY-p.y)>12;if(!moved)return;ignoreClick=true;setTimeout(()=>ignoreClick=false,100);const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.square');if(el){selected=p.square;move(p.square,el.dataset.square);selected=null;render()}});
$('board').addEventListener('click',e=>{if(ignoreClick)return;const s=e.target.closest('.square');if(s)select(s.dataset.square)});
$('pause').onclick=()=>{paused=!paused;lastTick=performance.now();render();save()};
const undoMove=()=>{if(!history.length)return;game.undo();const s=history.pop();time=s.time;last=s.last;started=s.started;paused=true;finished=false;selected=null;render();save()};
$('undo').onclick=undoMove;
$('undoBlack').onclick=undoMove;
$('new').onclick=()=>{if(started&&!confirm('Да започнем ли нова партия? Текущата ще бъде изтрита.'))return;$('resume').classList.add('hidden');$('setup').classList.remove('hidden')};
$('start').onclick=()=>{game=new Chess();initial=Number($('minutes').value)*60000;unlimited=initial===0;inc=Number($('increment').value);time={w:unlimited?0:initial,b:unlimited?0:initial};started=true;paused=true;finished=false;selected=null;last=null;history=[];lastTick=performance.now();$('setup').classList.add('hidden');render();save()};
$('resume').onclick=()=>{$('setup').classList.add('hidden');paused=false;lastTick=performance.now();render();save()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!finished){paused=true;save();}lastTick=performance.now();render()});
setInterval(()=>{const now=performance.now(),delta=Math.max(0,now-lastTick);lastTick=now;if(!started||paused||finished)return;const c=game.turn();time[c]+=unlimited?delta:-delta;if(!unlimited&&time[c]<=0){time[c]=0;finished=true;save();render();return}updateClocks();if(Math.floor(now/1000)!==Math.floor((now-delta)/1000))save()},100);
if(load()){$('resume').classList.remove('hidden');$('resume').textContent='Продължи запазената партия';}render();
</script></body></html>
