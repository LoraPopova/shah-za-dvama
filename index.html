function pieceSVG(type,color){return classicPieces[(color==='w'?'w':'b')+type.toUpperCase()].replace('<svg ','<svg class="piece-svg" ')}
let game=new Chess(),time={w:600000,b:600000},initial=600000,inc=0,unlimited=false,started=false,paused=false,finished=false,selected=null,last=null,history=[],lastTick=performance.now(),pending=null,press=null,ignoreClick=false;
const storage='chess-tablet-v1';
function fmt(ms){const sec=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function save(){try{localStorage.setItem(storage,JSON.stringify({pgn:game.pgn(),time,initial,inc,unlimited,started,paused,finished,history,last}));}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(storage));if(!x)return false;const g=new Chess();g.loadPgn(x.pgn||'');game=g;time=x.time;initial=x.initial;inc=x.inc;unlimited=x.unlimited;started=x.started;paused=true;finished=x.finished;history=x.history||[];last=x.last||null;return true}catch(e){return false}}
function status(){if(finished){if(!unlimited&&(time.w<=0||time.b<=0)){const loser=time.w<=0?'w':'b';const winner=loser==='w'?'Черните':'Белите';const other=game.board().flat().filter(Boolean).filter(p=>p.color!==loser&&p.type!=='k');return other.length===0||other.every(p=>p.type==='n'||p.type==='b')&&other.length===1?'Реми — недостатъчен материал за мат':winner+' печелят по време';}if(game.isCheckmate())return (game.turn()==='w'?'Черните':'Белите')+' печелят с мат!';return 'Реми — партията приключи.'}if(paused)return history.length?'Пауза':'Белите започват — часовникът тръгва след първия ход';return (game.turn()==='w'?'Белите':'Черните')+' са на ход'+(game.isCheck()?' — шах!':'')}
function updateClocks(){for(const c of ['w','b']){const el=$(c==='w'?'whiteClock':'blackClock');el.textContent=fmt(time[c]);el.classList.toggle('active',started&&!paused&&!finished&&game.turn()===c);el.classList.toggle('low',!unlimited&&time[c]<=30000);}}
function render(){const board=$('board');board.innerHTML='';const options=selected?game.moves({square:selected,verbose:true}):[];for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq='abcdefgh'[f]+r,p=game.get(sq),el=document.createElement('div');el.className='square '+(((8-r+f)%2)?'dark':'light');el.dataset.square=sq;if(last&&(last.from===sq||last.to===sq))el.classList.add('last');if(selected===sq)el.classList.add('selected');if(options.some(m=>m.to===sq))el.classList.add(p?'capture':'target');if(p){const span=document.createElement('span');span.className='piece '+(p.color==='w'?'whitepiece':'blackpiece');span.innerHTML=pieceSVG(p.type,p.color);el.append(span);}board.append(el)}$('message').textContent=status();$('moves').textContent=game.history().map((m,i)=>(i%2===0?Math.floor(i/2)+1+'. ':'')+m).join('  ');$('pause').textContent=paused?'Продължи':'Пауза';$('pause').disabled=!started||finished;const canUndo=history.length>0;$('undo').disabled=!canUndo;$('undoBlack').disabled=!canUndo;updateClocks();}
function move(from,to,promotion){if(finished||(!started))return;const choices=game.moves({square:from,verbose:true}).filter(m=>m.to===to);if(!choices.length)return;if(choices.some(m=>m.flags.includes('p'))&&!promotion){pending={from,to};$('promotion').innerHTML='';for(const type of ['q','r','b','n']){const b=document.createElement('button');b.textContent=symbols[game.turn()][type];b.onclick=()=>{const p=pending;pending=null;$('promoOverlay').classList.add('hidden');move(p.from,p.to,type)};$('promotion').append(b)}$('promoOverlay').classList.remove('hidden');return}const snapshot={time:{...time},last,started,paused,finished};try{const m=game.move({from,to,promotion:promotion||'q'});if(!m)return;history.push(snapshot);if(!unlimited)time[m.color]+=inc*1000;last={from,to};selected=null;started=true;paused=false;finished=game.isGameOver();lastTick=performance.now();render();save()}catch(e){}}
function select(sq){if(finished||!started)return;const p=game.get(sq);if(selected){const from=selected;if(p&&p.color===game.turn()){selected=sq;render();return}move(from,sq);selected=null;render();return}if(p&&p.color===game.turn()){selected=sq;render()}}
$('board').addEventListener('pointerdown',e=>{const s=e.target.closest('.square');if(!s)return;press={square:s.dataset.square,x:e.clientX,y:e.clientY};});
$('board').addEventListener('pointerup',e=>{if(!press)return;const p=press;press=null;const moved=Math.hypot(e.clientX-p.x,e.clientY-p.y)>12;if(!moved)return;ignoreClick=true;setTimeout(()=>ignoreClick=false,100);const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.square');if(el){selected=p.square;move(p.square,el.dataset.square);selected=null;render()}});
$('board').addEventListener('click',e=>{if(ignoreClick)return;const s=e.target.closest('.square');if(s)select(s.dataset.square)});
$('pause').onclick=()=>{paused=!paused;lastTick=performance.now();render();save()};
const undoMove=()=>{if(!history.length)return;game.undo();const s=history.pop();time=s.time;last=s.last;started=s.started;paused=true;finished=false;selected=null;render();save()};
$('undo').onclick=undoMove;
$('undoBlack').onclick=undoMove;
$('new').onclick=()=>{if(started&&!confirm('Да започнем ли нова партия? Текущата ще бъде изтрита.'))return;$('resume').classList.add('hidden');$('setup').classList.remove('hidden')};
$('start').onclick=()=>{game=new Chess();initial=Number($('minutes').value)*60000;unlimited=initial===0;inc=Number($('increment').value);time={w:unlimited?0:initial,b:unlimited?0:initial};started=true;paused=true;finished=false;selected=null;last=null;history=[];lastTick=performance.now();$('setup').classList.add('hidden');render();save()};
$('resume').onclick=()=>{$('setup').classList.add('hidden');paused=false;lastTick=performance.now();render();save()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!finished){paused=true;save();}lastTick=performance.now();render()});
setInterval(()=>{const now=performance.now(),delta=Math.max(0,now-lastTick);lastTick=now;if(!started||paused||finished)return;const c=game.turn();time[c]+=unlimited?delta:-delta;if(!unlimited&&time[c]<=0){time[c]=0;finished=true;save();render();return}updateClocks();if(Math.floor(now/1000)!==Math.floor((now-delta)/1000))save()},100);
if(load()){$('resume').classList.remove('hidden');$('resume').textContent='Продължи запазената партия';}render();
</script></body></html>
